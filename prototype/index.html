/* ==================================================================
   V0.2 · 一键导出（FR-019）—— 这次是真的产出文件
   ① JSON：全量（待办 / 分类 / 复盘），结构自解释，可被本应用重新导入（导入在 V0.3）
   ② CSV：带 UTF-8 BOM，双击用 Excel 打开中文不乱码
   ③ 两个文件里 **都不含 API Key / 云密钥**
   ================================================================== */
/* V0.2 · APK 桥接：装进手机壳时，导出直接落到「下载 / 待办清单」，
   分块传，避免一次传太大。网页里没有 AppBridge，就照旧用浏览器下载。 */
function nativeSave(name, text){
  try{
    if(typeof AppBridge==='undefined' || !AppBridge.writeBegin) return false;
    AppBridge.writeBegin(name);
    const N=200000;
    for(let i=0;i<text.length;i+=N) AppBridge.writeChunk(text.slice(i,i+N));
    return AppBridge.writeEnd()==='ok';
  }catch(e){ return false; }
}
function downloadFile(name, text, mime){
  if(nativeSave(name, text)) return;          /* 手机里走这一条，文件真进「下载 / 待办清单」 */
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}
const csvCell=s=>{ s=String(s==null?'':s); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
function buildCSV(list){
  const head=['标题','归属','分类','截止日期','时间','轻重缓急','重要','紧急','状态','完成时间','备注（你的原话）','来源','创建时间','最后修改'];
  const rows=list.map(t=>[
    t.title||'', t.domain==='work'?'工作':(t.domain==='life'?'生活':'未归类'), t.cat||'（未分类）',
    t.due||'', t.time||'', quadText(t.imp,t.urg)||'未判断',
    t.imp==null?'未判断':(t.imp?'是':'否'), t.urg==null?'未判断':(t.urg?'是':'否'),
    t.done?'已完成':'未完成', t.doneAt||'', t.remark||'',
    t.source==='ai'?'AI 解析':(t.source==='voice'?'语音':'手工/规则'),
    t.createdAt||'', t.updatedAt||''
  ].map(csvCell).join(','));
  return '\ufeff'+[head.join(',')].concat(rows).join('\r\n');   /* BOM + CRLF：Excel 最吃的组合 */
}
function buildJSON(list){
  return {
    app:'待办清单', version:'0.2', type:'full-backup', exportedAt:nowStamp(),
    scope:'全部数据',
    字段说明:{
      todos:'待办条目。imp/urg 是三态（null=未判断）；manual 标记哪些是人工改过的，重新解析不会覆盖',
      CATS:'分类名单，分工作 / 生活两个域', CAT_STYLE:'分类的颜色与符号',
      reviews:'每日复盘。text=一句话总结，pending=true 表示还没生成成功，下次会自动重试'
    },
    todos:list, CATS, CAT_STYLE, reviews,
    注意:'本文件不含 API Key 与云密钥，可放心另存网盘或发给自己'
  };
}
/* ==================================================================
   V0.2 · 导入备份 —— 把之前导出的 JSON 吃回来
   支持两种文件：① 全量备份（导出备份产出的）② 自动备份归档（含 30 天快照，可选其中一天）
   两种模式：**合并**（默认，按 id 去重、同 id 以最后修改时间新的为准）/ **覆盖**（先清空再导入）
   ================================================================== */
function pickImportFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json,text/plain';
  inp.style.display='none';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    if(!f){ return; }
    const fr=new FileReader();
    fr.onload=()=>{ try{ applyImport(String(fr.result||''), f.name); }
                    catch(e){ modal('这个文件读不了', '不是有效的 JSON 备份文件。<br><br>请选<b>从本应用导出的</b>那个 ".json" 文件。'); } };
    fr.onerror=()=>{ modal('读文件失败', '换一个文件试试，或者把它先拷到手机上再选。'); };
    fr.readAsText(f,'utf-8');
    inp.remove();
  };
  document.body.appendChild(inp);
  inp.click();
}
/* 把文件内容解析成「待办 + 分类 + 复盘」三件套，认不出就抛错 */
function parseImport(text){
  const j=JSON.parse(text);
  if(!j || typeof j!=='object') throw new Error('bad');
  /* ② 自动备份归档：让用户挑一天（默认最新的一天） */
  if(j.type==='auto-backups' && Array.isArray(j.days) && j.days.length){
    const days=j.days.slice().sort((a,b)=>String(a.date)<String(b.date)?1:-1);
    modalOptions('这份文件里有 '+days.length+' 天', days.slice(0,14).map(d=>[d.date, d.date+' · '+((d.data&&d.data.todos)||[]).length+' 条']),
      v=>{ const one=days.find(d=>d.date===v); if(one) prepareImport(one.data||{}, v); });
    return null;
  }
  /* ① 全量备份 */
  if(!Array.isArray(j.todos)) throw new Error('bad');
  prepareImport(j, j.exportedAt ? String(j.exportedAt).slice(0,10) : '');
  return null;
}
/* 合并：同一个 id 只留一份，两边都改过就以「最后修改时间更晚」的为准（跟云同步一个口径） */
function mergeImport(data){
  const inc=(data.todos||[]).filter(t=>t&&t.id!=null);
  const map={}; todos.forEach(t=>map[t.id]=t);
  let added=0, updated=0;
  inc.forEach(t=>{
    const old=map[t.id];
    if(!old){ todos.push(t); map[t.id]=t; added++; }
    else if(String(t.updatedAt||'') > String(old.updatedAt||'')){ Object.assign(old,t); updated++; }
  });
  Object.keys(data.CATS||{}).forEach(d=>{
    (data.CATS[d]||[]).forEach(c=>{ if(CATS[d] && CATS[d].indexOf(c)<0) CATS[d].push(c); });
  });
  Object.assign(CAT_STYLE, data.CAT_STYLE||{});
  Object.keys(data.reviews||{}).forEach(k=>{ if(!reviews[k]) reviews[k]=data.reviews[k]; });
  render(true);
  return {added, updated, total:todos.filter(t=>!t.deleted).length};
}
/* 覆盖：先清空，只留文件里的 */
function overwriteImport(data){
  const inc=(data.todos||[]).filter(t=>t&&t.id!=null);
  todos.length=0; inc.forEach(t=>todos.push(t));
  if(data.CATS) Object.keys(data.CATS).forEach(d=>{ if(Array.isArray(data.CATS[d])) CATS[d]=data.CATS[d]; });
  Object.assign(CAT_STYLE, data.CAT_STYLE||{});
  Object.keys(data.reviews||{}).forEach(k=>reviews[k]=data.reviews[k]);
  render(true);
  return {added:inc.length, updated:0, total:todos.length};
}
/* 先把要导入的东西摊开给你看 + 让你选合并方式，不闷头就改数据 */
function prepareImport(data){
  const inc=(data.todos||[]).filter(t=>t&&t.id!=null);
  if(!inc.length){ modal('这个文件里没有待办', '换个文件试试。'); return; }
  const mine=todos.filter(t=>!t.deleted).length;
  modalOptions('导入方式',
    [['merge',`合并（推荐）· 保留现有 ${mine} 条，再并入 ${inc.length} 条`],
     ['overwrite',`覆盖 · 清空现有数据，只留这份文件里的 ${inc.length} 条`]],
    v=>{
      const r = (v==='overwrite') ? overwriteImport(data) : mergeImport(data);
      modal(v==='overwrite'?'导入完成（覆盖）':'导入完成（合并）',
        v==='overwrite'
          ? `原来的数据已被替换，现在是 <b>${r.total}</b> 条待办。`
          : `新增 <b>${r.added}</b> 条 · 更新 <b>${r.updated}</b> 条 · 现在一共 <b>${r.total}</b> 条。<br><br>
             合并规则：同一个条目只留一份，两边都改过就以<b>最后修改时间更晚</b>的那份为准。`);
    });
}
function applyImport(text, filename){
  try{ parseImport(text); }
  catch(e){ modal('这个文件读不了',
      `<b>${esc(filename||'')}</b> 不是有效的备份文件。<br><br>
       请选<b>从本应用导出的</b>那个 ".json"（不是 CSV）。CSV 是给 Excel 看的，App 读不了。`); }
}

/* 只导出「全部数据」一种 —— 少一个选择就少一次选错（自动备份的快照另有存档页可以单独导） */
function doExport(){
  const stamp=fmtD(new Date());
  const list=todos.filter(t=>!t.deleted);
  if(!list.length){ toast('还没有任何待办可以导出'); return; }
  const jn=`待办清单-备份-${stamp}.json`, cn=`待办清单-${stamp}.csv`;
  const inApp = (typeof AppBridge!=='undefined' && !!AppBridge.isApp);
  const ver   = inApp ? 'V'+AppBridge.getVersionName() : APPVER;
  /* V0.4：导出范围选项已砍掉（只剩「全部数据」一种），这里别再传旧参数 ——
     之前遗留的 buildJSON(list,scope,day) 里 scope/day 两个变量根本不存在，
     一按【导出】就抛 ReferenceError，被吞掉后表现成「点了没反应」（2026-10-21 发版审查发现） */
  downloadFile(jn, JSON.stringify(buildJSON(list),null,2), 'application/json;charset=utf-8');
  downloadFile(cn, buildCSV(list), 'text/csv;charset=utf-8');
  modal('已导出两份文件',
    `· <b>${jn}</b><br><span style="font-size:12px">完整备份 · 共 ${list.length} 条待办 + 分类 + 复盘，可被本应用还原</span><br><br>
     · <b>${cn}</b><br><span style="font-size:12px">Excel 直接双击打开，中文不乱码</span><br><br>
     <b>导出到哪儿</b><br>${inApp
       ? '手机：<b>本机 / 下载 / 待办清单 /</b> —— 用「文件管理 → 下载」就能找到'
       : '电脑：<b>浏览器默认的下载目录</b>'}<br><br>
     文件里<b>不含 API Key</b>，可以放心另存或发给自己。<br>本机最近一次自动备份：<b>${esc(BAK.last()||'今天')}</b><br>
     <span style="font-size:12px;color:var(--ink3)">当前版本 ${esc(ver)}${inApp?'（手机壳）':'（网页）'}</span>`);
}

function toast(msg){
  const p=document.getElementById('phone');
  p.querySelectorAll('.toast').forEach(t=>t.remove());   /* 连续提示别叠罗汉：新的顶掉旧的 */

  setTimeout(()=>{ d.classList.add('bye'); setTimeout(()=>d.remove(),260); },1800);

/* ---------- 四象限选择器（M1 · v2.8）----------
   1 次点击即选中；选中后写入的仍是 imp / urg 两个字段（存储层不变） */
/* ---------- 四象限选择器 ----------
   真·四象限：**纵轴=重要不重要（上重要 / 下不重要），横轴=紧急不紧急（左不急 / 右紧急）**。
   点一格就选好，写回存储的仍然是 imp / urg 两个三态字段（硬规则 3：存两个、显示一个）。 */
const QUAD_SOFT={'11':'rgba(220,38,38,.10)','10':'rgba(37,99,235,.10)',
                 '01':'rgba(245,158,11,.16)','00':'rgba(148,163,184,.18)'};
function openQuad(curImp,curUrg,cb){
  const p=document.getElementById('phone');
  const fresh=!p.querySelector('.modal-mask');
  p.querySelectorAll('.modal-mask').forEach(m=>m.remove());
  const ck=quadKey(curImp,curUrg);
  /* 没选中也上色（选起来更快，一眼就知道哪一格是啥）；
     选中 = 描边加粗 + 右上角一个小对勾，不靠「有没有颜色」来区分 */
  const cell=(k,name,desc,color)=>{
    const on=ck===k;
    return `<button class="qcell ${on?'on':''}" data-act="qpick" data-v="${k}"
      style="background:${QUAD_SOFT[k]}${on?';border-color:'+color:''}">
      <span class="qname" style="color:${color}">${name}</span>
      <span class="qdesc">${desc}</span>
      ${on?`<span class="qcheck" style="background:${color}">✓</span>`:''}
    </button>`;
  };
  const d=document.createElement('div'); d.className='modal-mask'+(fresh?'':' reinit'); d.dataset.act='closemodal';
  /* 真·数学象限：两条轴从四格**中间的缝隙**穿过去，标注挂在轴的两端 */
  d.innerHTML=`<div class="modal quad-modal ${fresh?'':'reinit'}" data-act="noop">
    <div class="modal-t">轻重缓急 · 点一格就好</div>
    <div class="quadwrap">
      <div class="qcross-h"></div>
      <div class="qcross-v"></div>
      <div class="qgrid">
        ${cell('10','计划做','重要 · 不急','var(--q2)')}
        ${cell('11','马上做','重要 · 紧急','var(--q1)')}
        ${cell('00','有空再说','不重要 · 不急','var(--q4)')}
        ${cell('01','快速处理','不重要 · 紧急','var(--q3)')}
      </div>
      <span class="qlab qlab-t">重要 ↑</span>
      <span class="qlab qlab-b">不重要 ↓</span>
      <span class="qlab qlab-l">← 不急</span>
      <span class="qlab qlab-r">紧急 →</span>
    </div>
    <div class="hint">横轴 = 紧不紧急 · 纵轴 = 重不重要</div>
    <button class="btn ghost" data-act="qpick" data-v="">清除判断（回到未判断）</button>
    <button class="btn ghost" data-act="closemodal">取消</button></div>`;
  p.appendChild(d);
  S._cb=cb;
}

/* ---------- 日期选择：直接弹出月历来点 ---------- */
const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const MINS=Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0'));  /* 5 分钟一档 */
function dpTime(){   /* 从两个下拉里读出时间，别让用户手打 */
  const h=document.getElementById('_dph'), m=document.getElementById('_dpmin');
  if(!h) return (S._dp&&S._dp.time)||'';
  if(!h.value) return '';
  return h.value+':'+(m&&m.value?m.value:'00');
}
function openDatePicker(title,cur,time,cb){
  S._cb=cb;
  /* 年份必须**跟着选中日期**走，不能写死某一年，也不能只存月份：
     之前这里没有 y、渲染时还把年份锁成 2026，于是翻到 12 月就再也回不来，
     跨年之后选出来的日子全是过去的年度（写进去立刻变逾期）（2026-10-21 修） */
  const base=new Date((cur||TODAY)+'T00:00:00');
  S._dp={title, sel:cur||TODAY, time:time||'',
         y:isNaN(base)?new Date().getFullYear():base.getFullYear(),
         m:isNaN(base)?new Date().getMonth():base.getMonth()};
  renderDatePicker();
}
function renderDatePicker(){
  const p=document.getElementById('phone');
  const fresh=!p.querySelector('.modal-mask');   /* 点日期 / 翻月是原地重建 → 不重播进场动画 */
  p.querySelectorAll('.modal-mask').forEach(m=>m.remove());
  const dp=S._dp; if(!dp) return;
  if(dp.y==null) dp.y=new Date((dp.sel||TODAY)+'T00:00:00').getFullYear();   /* 兼容旧会话状态 */
  const y=dp.y, m=dp.m;
  const [curH,curM]=(dp.time||'').split(':');
  const first=(new Date(y,m,1).getDay()||7)-1;        // 周一为一周起点
  const days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++) cells+='<span class="dp-cell"></span>';
  for(let d=1;d<=days;d++){
    const key=fmtD(new Date(y,m,d));
    cells+=`<button class="dp-cell ${dp.sel===key?'sel':''} ${key===TODAY?'today':''}"
      data-act="dpday" data-v="${key}">${d}</button>`;
  }
  const el=document.createElement('div'); el.className='modal-mask'+(fresh?'':' reinit'); el.dataset.act='closemodal';
  el.innerHTML=`<div class="modal ${fresh?'':'reinit'}" data-act="noop" style="max-width:320px;max-height:680px;overflow:auto">
    <div class="modal-t">${dp.title}</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="btn ghost" data-act="dpm" data-v="-1" style="flex:none;padding:4px 12px">‹</button>
      <span style="font-size:14px;font-weight:600">${y} 年 ${m+1} 月</span>
      <button class="btn ghost" data-act="dpm" data-v="1" style="flex:none;padding:4px 12px">›</button>
    </div>
    <div class="dp-head">${['一','二','三','四','五','六','日'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="dp-grid">${cells}</div>
    <div class="label">时间（下拉选，不用手打）</div>
    <div style="display:flex;gap:6px;align-items:center;justify-content:center">
      <select class="tin" id="_dph" style="flex:none;width:78px;text-align:center;text-align-last:center;padding:10px 6px">
        <option value="">—</option>
        ${HOURS.map(h=>`<option value="${h}" ${curH===h?'selected':''}>${h}</option>`).join('')}
      </select>
      <span style="font-size:18px;font-weight:600;color:var(--ink3);flex:none">:</span>
      <select class="tin" id="_dpmin" style="flex:none;width:78px;text-align:center;text-align-last:center;padding:10px 6px">
        <option value="">—</option>
        ${MINS.map(m=>`<option value="${m}" ${curM===m?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
    <div class="btnrow">
      <button class="btn ghost" data-act="dpclear">清除</button>
      <button class="btn" data-act="dpok">确定</button>
    </div></div>`;
  p.appendChild(el);
}

/* A2 面板：点某一行就能改 */
function openField(key){
  if(!S.parse) S.parse={title:'',due:'',dueText:'',time:'',imp:null,urg:null,cat:null,domain:S.domain};
  const p=S.parse;
  p.manual=p.manual||{};                       /* 记下你亲自动过的字段：再解析也不许覆盖 */
  if(key==='title'){ modalInput('标题','这条要做什么',p.title,v=>{S.parse.title=v.trim(); p.manual.title=true; render();}); return; }
  if(key==='due'){
    openDatePicker('什么时候完成',p.due,p.time,(dt,tm)=>{
      S.parse.due=dt||''; S.parse.time=tm||'';
      S.parse.dueText = dt ? dt.slice(5).replace('-','月')+'日'+(tm?' '+tm:'') : '（没设时间）';
      p.manual.due=true; p.manual.time=true;
      render();
    }); return;
  }
  if(key==='quad'){ openQuad(p.imp,p.urg,(imp,urg)=>{
      S.parse.imp=imp; S.parse.urg=urg; p.manual.imp=true; p.manual.urg=true; render(); }); return; }
  /* M1（D-25）：这里只改「这一条」的归属，不切整个 App 的域；分类不可跨域，换域即清空分类 */
  if(key==='domain'){ modalOptions('归到哪个域',[['work','工作'],['life','生活']],
      v=>{S.parse.domain=v; S.parse.cat=null; p.manual.domain=true; render();}); return; }
  if(key==='cat'){
    modalOptions('分到哪一类', catOpts(p.domain||S.domain).concat([['','不分类']]),
      v=>{S.parse.cat=v||null; p.manual.cat=true; render();}); return;
  }
}

/* 详情页：点某一行就能改 */
function openDetailField(key){
  const t=todos.find(x=>x.id===S.detailId); if(!t) return;
  t.manual=t.manual||{};
  if(key==='title'){ modalInput('标题','这条要做什么',t.title||'',v=>{t.title=v.trim();t.manual.title=true;render();}); return; }
  if(key==='due'){
    openDatePicker('什么时候完成',t.due,t.time,(dt,tm)=>{
      t.due=dt||null; t.time=tm||'';
      t.manual.due=true; t.manual.time=true;      /* 手填的时间，下次解析不许冲掉 */
      render();
    }); return;
  }
  if(key==='quad'){ openQuad(t.imp,t.urg,(imp,urg)=>{
      t.imp=imp; t.urg=urg; t.manual.imp=true; t.manual.urg=true; render(); }); return; }
  if(key==='domain'){ modalOptions('归到哪个域',[['work','工作'],['life','生活']],
      v=>{t.domain=v; t.manual.domain=true; render();}); return; }
  if(key==='cat'){
    const dm=t.domain||S.inboxFrom||S.domain;
    modalOptions('分到哪一类', catOpts(dm).concat([['','不分类']]),
      v=>{t.cat=v||null; t.manual.cat=true; render();}); return;
  }
}

/* 出箱判定：缺哪几项（分类选填，不参与判定）
   **标题的特殊处理**：标题为空但备注有内容时，不算缺 —— 保存时用备注前 12 字自动补上。
   之前这里直接判 t.title 为空就拦下，可界面上标题行显示的是「备注前 12 字」，
   看着像填过了却存不住，是个纯误导（V0.2 修复）。 */
function inboxMissing(t){
  const miss=[];
  if(!(t.title || (t.remark||'').trim())) miss.push('标题');
  if(!t.due) miss.push('完成时间');
  if(t.imp==null || t.urg==null) miss.push('轻重缓急');
  if(!t.domain) miss.push('归属');
  return miss;
}

/* ==================================================================
   把解析结果写进条目 / 面板 —— **被你手动改过的字段一律不动**（硬规则 5）
   之前只保护了 imp / urg，所以「手填的时间一点 ✦ 就没了」。
   现在 title / due / time / imp / urg / cat / domain 七个字段逐个判断。
   ================================================================== */
const PARSE_FIELDS=['title','due','time','imp','urg','cat','domain'];
function applyParse(t, p){
  t.manual=t.manual||{};
  const m=t.manual;
  if(!m.title && p.title) t.title=p.title;
  if(!m.due && p.due){ t.due=p.due; if(!m.time) t.time=p.time||''; }
  if(!m.time && !m.due && p.time) t.time=p.time;
  if(!m.imp && p.imp!=null) t.imp=p.imp;
  if(!m.urg && p.urg!=null) t.urg=p.urg;
  if(!m.cat && p.cat) t.cat=p.cat;
  if(!m.domain && p.domain) t.domain=p.domain;
  t.parsed=true;
  return t;
}
/* 重新解析时，把上一次「手动改过」的字段原样带回来 */
function keepManual(oldP, newP){
  newP.manual=newP.manual||{};
  if(!oldP || !oldP.manual) return newP;
  PARSE_FIELDS.forEach(k=>{ if(oldP.manual[k]){ newP[k]=oldP[k]; newP.manual[k]=true; } });
  return newP;
}
/* 一共有几个字段是你手动填的（界面上可以提示） */
function manualCount(x){ const m=(x&&x.manual)||{}; return PARSE_FIELDS.filter(k=>m[k]).length; }

/* ============ 解析服务（M1：规则版）============
   接口契约：doParse(原话) → {title, due, time, dueText, imp, urg, cat, domain}
   M1 用本地规则实现（不联网、不要 Key）；日后换真大模型，只换这一个函数，
   界面与所有调用方一行都不用改。 */
function doParse(text){
  const t=text||'';
  /* 重要 / 紧急：提到才算「是」，没提到 = 「否」（PRD 硬规则：绝不擅自判定） */
  const imp=/重要|关键|老板|考核|必须|要紧/.test(t);
  const urg=/急|尽快|马上|今天必须|催|赶紧|临时|截止/.test(t);
  let due='',dueText='';
  const addN=n=>{const x=new Date();x.setDate(x.getDate()+n);return fmtD(x);};  /* 本地日期，不再走 toISOString（会转成 UTC 算错一天） */
  /* 凌晨特例（2026-10-18 主人提的，当晚按主人要求把窗口从 2 点放宽到 4 点）：
     00:00~03:59 之间说的「明天/明早/明晚/明日」其实指**当天**
     —— 半夜说"明早交报告"，要的是当天上午，不是隔一天；「后天」顺势改成 +1 天。
      过了凌晨 4 点就按字面来。AI 提示词里是同一条规则，两边口径必须一致。 */
  const _early=new Date().getHours()<4;
  if(/今天/.test(t)){due=TODAY;dueText='今天';}
  else if(/明天|明早|明晚|明日/.test(t)){
    if(_early){due=TODAY;dueText='今天';}else{due=addN(1);dueText='明天';}
  }
  else if(/后天/.test(t)){due=addN(_early?1:2);dueText=_early?'明天':'后天';}
  else if(/下周/.test(t)){due=addN(7);dueText='下周';}
  else if(/下个月|下月/.test(t)){const x=new Date();x.setMonth(x.getMonth()+1);due=fmtD(x);dueText='下个月';}
  const m=t.match(/(\d{1,2})\s*[点時时](半|一刻|\d{1,2})?/);
  let hh=m?+m[1]:null;
  /* 下午 / 晚上 / 傍晚 要转成 24 小时制，否则「下午3点」会变成凌晨 3 点 */
  if(hh!=null && hh<12 && /下午|晚上|傍晚|夜里|晚间|今晚|明晚/.test(t)) hh = hh+12;
  if(hh!=null && hh<12 && /中午/.test(t)) hh = 12;
  let mm='00';
  if(m&&m[2]) mm = m[2]==='半' ? '30' : (m[2]==='一刻' ? '15' : String(m[2]).padStart(2,'0'));
  const time=m?(String(hh).padStart(2,'0')+':'+mm):'';
  if(m) dueText+=' '+hh+':'+mm;
  let cat=null;
  const all=CATS[S.domain]||[];
  for(const c of all) if(t.includes(c)) cat=c;
  if(!cat && /报表|报告|年报|周报/.test(t)) cat=all.find(c=>/报表|材料/.test(c))||null;
  if(!cat && /电费|房租|缴费|账单|话费/.test(t)) cat=all.find(c=>/缴费|账单/.test(c))||null;
  if(!cat && /买|采购|超市|菜|牛奶/.test(t)) cat=all.find(c=>/采购/.test(c))||null;
  if(!cat && /开会|会议|评审|周会/.test(t)) cat=all.find(c=>/会议|沟通/.test(c))||null;
  /* 炼出一句话标题：把时间词、客气话、轻重缓急的口头禅都摘掉（V0.2：规则版也练干净些，
     它是 AI 挂掉时的兜底，不能太寒碜） */
  const title=t.replace(/[，。！,.!、；;]/g,' ')
    /* 「下周三」要整块摘掉，别剩个「三」；但要躲开「整理一下周报」里的「下周」两个字 */
    .replace(/(?<![一-龥])(下周|本周|这周|下个礼拜|礼拜)[一二三四五六日天1-7]?/g,'')
    .replace(/(明天|今天|后天|明早|明晚|明日|今晚|下周|下个月|之前|前|尽快|马上|记得|有空的时候|帮我|提醒我|麻烦|去|一下|上午|下午|中午|晚上|傍晚)/g,'')
    .replace(/(这个|那件事)?(挺|很|非常|特别)?(重要|要紧|关键|着急|急)/g,'')
    .replace(/(上午|下午|中午|晚上|明早|今晚)?\s*\d{1,2}\s*[点時时](半|一刻|\d{1,2})?前?/g,'')
    .replace(/\s+/g,' ').trim().replace(/[的了吧呢]$/,'').trim().slice(0,20);
  return {title:title||'',due,time,dueText:dueText||'（没设时间）',imp,urg,cat,domain:S.domain};
}

/* ==================================================================
   V0.2 · 真 AI 解析（FR-001）—— 只换实现，不换契约
   返回结构 == doParse() == {title, due, time, dueText, imp, urg, cat, domain}
   所以调用方（解析面板 / 保存 / 收件箱 / 排序）一行都不用改。
   失败 = 降级回规则版，用户完全无感（不弹错误）。
   ================================================================== */
function aiErrText(status, body){
  if(status===401||status===403) return 'API Key 不对，或者已经失效了 —— 换一个新的试试';
  if(status===404) return '接口地址或模型名写错了 —— 换服务商时这两项要跟着改';
  if(status===429) return '额度用完了，或者请求太密 —— 等一会儿再试';
  if(status>=500) return '服务商那边出状况了，稍后再试';
  const b=(body||'').slice(0,120);
  return b ? '服务商返回：'+b : '请求没成功（'+status+'）';
}
/* 一次对话。超时就抛 —— 上层接到就降级，绝不让界面卡住 */
async function llmChat(sys, user, ms){
  const c=AI.cfg;
  if(!AI.ready()) throw new Error('AI 还没配好');
  const url=c.base.replace(/\/+$/,'')+'/chat/completions';
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(), ms||8000);
  try{
    const r=await fetch(url,{
      method:'POST',
      signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.model,temperature:0.2,
        messages:[{role:'system',content:sys},{role:'user',content:user}]})
    });
    if(!r.ok){ throw new Error(aiErrText(r.status, await r.text().catch(()=>''))); }
    const j=await r.json();
    const txt=j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
    if(!txt) throw new Error('AI 什么都没返回');
    return String(txt);
  }catch(e){
    if(e && e.name==='AbortError') throw new Error('响应超时');
    /* fetch 直接抛 TypeError = 请求压根没发出去：跨域被拦 / 网络不通 / 地址写错（此时没有 HTTP 状态码可看） */
    if(e instanceof TypeError || /Failed to fetch|NetworkError|Network request failed|Load failed/i.test(String(e && e.message)))
      throw new Error('请求没发出去 —— 通常是浏览器的跨域限制拦下了它（不是 Key 的问题）。换用能跨域的服务商，或在手机 App 里用');
    throw e;
  }finally{ clearTimeout(timer); }
}
/* 到点必须给个说法 —— AbortController 在某些环境里不一定奏效，
   外面再套一层 race，保证 await 一定会返回，界面绝不会干等 */
function withTimeout(p, ms, msg){
  let timer;
  return Promise.race([
    p.finally(()=>clearTimeout(timer)),
    new Promise((_,rej)=>{ timer=setTimeout(()=>rej(new Error(msg||'响应超时')), ms); })
  ]);
}
/* 从 AI 的回话里抠出 JSON —— 模型爱加代码块围栏、爱多说两句，这里统一兜住 */
function jsonFromAI(s){
  if(!s) return null;
  let t=String(s).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<0) return null;
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; }
}
/* AI 结果必须过这一道校验：
   ① 分类只能在已有名单里，自造的一律丢掉  ② imp/urg 只认布尔，缺失按 false（硬规则：不擅自给重要）
   ③ 日期格式不对就丢                      ④ dueText 为空时补一句人能看懂的 */
function normalizeAI(o){
  const r={
    title:String(o.title||'').trim().slice(0,20),
    due:'',time:'',dueText:'',
    imp:o.imp===true||o.imp==='true',
    urg:o.urg===true||o.urg==='true',
    cat:null,domain:''
  };
  if(/^\d{4}-\d{2}-\d{2}$/.test(o.due||'')) r.due=o.due;
  if(/^\d{1,2}:\d{2}$/.test(o.time||'')) r.time=String(o.time).padStart(5,'0');
  if(o.domain==='work'||o.domain==='life') r.domain=o.domain;
  /* 分类白名单：跨域也不行，必须在**该域**的名单里 */
  const list=CATS[r.domain||S.domain]||[];
  if(o.cat && list.indexOf(o.cat)>=0) r.cat=o.cat;
  const inBox=(o.cat&&!r.cat);
  if(r.due){
    r.dueText=r.due.slice(5).replace('-','月')+'日'+(r.time?' '+r.time:'');
    if(o.dueText&&String(o.dueText).length<=16&&/明天|后天|今天|周|月/.test(String(o.dueText))) r.dueText=String(o.dueText);
  } else r.dueText=String(o.dueText&&o.dueText!=='（没设时间）'?o.dueText:'（没设时间）');
  r._strayCat=inBox;   /* AI 自造了分类名：记一笔，方便在界面上提示 */
  return r;
}
/* 异步解析：**永远成功**（最差也是规则版结果） */
async function doParseAsync(text){
  if(!AI.ready()) { const r=doParse(text); r.mode='rule'; return r; }
  const cats=(CATS[S.domain]||[]);
  const nowText=nowStamp()+' 星期'+'日一二三四五六'[new Date().getDay()];
  try{
    const raw=await withTimeout(
      llmChat(PROMPTS.parseSys, PROMPTS.parseUser(text,cats,nowText), 3000), 3000, '响应超时'); /* 3 秒没回来就降级 */
    const o=jsonFromAI(raw);
    if(!o) throw new Error('返回读不懂');
    const r=normalizeAI(o);
    if(!r.title) throw new Error('没拆出标题');
    if(!r.domain) r.domain=S.domain;
    r.mode='ai';
    return r;
  }catch(e){
    const r=doParse(text); r.mode='rule'; r.reason=(e&&e.message)||'';
    return r;
  }
}

/* ==================================================================
   V0.2 · 每日复盘（FR-016 / FR-017）
   一句话 + 统计，**全天跨域合并**：工作/生活一起算，两个域看到的文案逐字相同。
   三条铁律：归属于「上一天」· 一天最多一条 · 生成后锁定（只有手动点【重新生成】才重算）。
   ================================================================== */
const REV = {
  /* 当天的跨域事实（不看 S.domain —— 复盘是跨域的） */
  fact(key){
    const live=todos.filter(t=>!t.deleted&&!t.inbox&&t.due===key);
    /* 当天实际完成的：不管它原定哪天，只要是在这天打勾的都算 */
    const doneL=todos.filter(t=>!t.deleted&&!t.inbox&&t.done&&t.doneAt&&t.doneAt.slice(0,10)===key);
    const undoneL=live.filter(t=>!t.done);
    const lateL=undoneL.filter(t=>key<TODAY);
    /* 拖得最久的一件 —— 吐槽要有事实素材，不能凭空损 */
    let worst='', lateDays=0;
    lateL.forEach(t=>{
      const d=Math.round((new Date(TODAY)-new Date(t.due))/864e5);
      if(d>lateDays){ lateDays=d; worst=titleOf(t); }
    });
    return {
      worst, lateDays,
      total: live.length + doneL.filter(t=>t.due!==key).length,
      done: doneL.length,
      undone: undoneL.length,
      overdue: lateL.length,
      doneList: doneL.map(titleOf).slice(0,8),
      undoneList: undoneL.map(titleOf).slice(0,8),
      overdueList: lateL.map(titleOf).slice(0,5),
      /* 这天有没有「动静」：有完成 / 有新增 / 有逾期的东西 */
      moved: doneL.length>0 || todos.some(t=>t.createdAt&&t.createdAt.slice(0,10)===key) || undoneL.length>0
    };
  },
  /* 是否值得生成：完全没动静就什么都不留（不留空白记录） */
  worth(key){ const f=REV.fact(key); return f.moved && (f.total>0||f.done>0); },
  async build(key, manual){
    if(!manual){
      if(reviews[key] && !reviews[key].pending) return;    /* 已生成 → 锁定，不重算 */
      if(!REV.worth(key)) return;                          /* 没动静 → 一条都不留 */
    }
    const f=REV.fact(key);
    if(!AI.ready()){
      reviews[key]={pending:true,total:f.total,done:f.done,overdue:f.overdue,genAt:'',manual:!!manual};
      return;
    }
    try{
      const txt=(await withTimeout(
        llmChat(PROMPTS.reviewSys, PROMPTS.reviewUser(key,f), 12000), 12000, '响应超时')).trim()
        .replace(/^["'“”]|["'“”]$/g,'').slice(0,140);
      reviews[key]={text:txt,total:f.total,done:f.done,overdue:f.overdue,
                    genAt:nowStamp(),manual:!!manual,pending:false};
    }catch(e){
      /* 失败 / 断网 / 超额度：标记「待生成」，下次打开自动重试，不弹错误打扰 */
      reviews[key]={pending:true,total:f.total,done:f.done,overdue:f.overdue,genAt:'',manual:!!manual};
    }
  },
  /* 启动时跑一遍：① 昨天没复盘且昨天有动静 → 生成
     ② 连着好几天没打开 → 往前回溯最近 7 天补（更早不自动生成，可手动补） */
  async ensure(){
    const jobs=[];
    for(let i=1;i<=7;i++){
      const d=shift(-i);
      const r=reviews[d];
      if(r && !r.pending) continue;               /* 已有内容 → 锁定 */
      if(!REV.worth(d)) continue;                 /* 完全没动静 → 不留记录 */
      jobs.push(d);
    }
    for(const d of jobs) await REV.build(d,false);
    if(jobs.length){ render(true); }
  },
  /* 日历里「该灰着」的日子 —— 有内容就算，pending 不灰（还没生成出来） */
  has(key){ return !!(reviews[key] && reviews[key].text); }
};

/* ============ 事件 ============ */
/* 点击处理抽成具名函数：一来事件委托照旧，二来测试里能直接调用它，
   「点了没反应」这类静默崩溃以后能被自动测出来（2026-10-14 吃过这个亏） */
function handleAct(e){
 try{
  const el=e.target.closest('[data-act]');
  /* 点框外（页面上任何不带 data-act 的空处）→ 退出当前「展开态」：
     · 聚焦的输入框 → 退回 A1 待机
     · 展开的筛选面板 → 收起成一行小入口（**条件保留**，按钮上写明「筛选中 · N 条」，
       跟 A2 退出聚焦后输入框内容还在是一个道理；要彻底清条件，点面板里的【清空】） */
  if(!el){
    let _chg=false;
    if(S.focused && !S.sub && S.tab==='note'){ S.focused=false; _chg=true; }
    if(S.qOpen && !S.sub){ S.qOpen=false; _chg=true; }
    if(_chg) render();
    return;
  }
  const act=el.dataset.act, v=el.dataset.v;

  if(act==='noop'){return;}

  if(act==='field'){ openField(v); return; }
  if(act==='miok'||act==='miopt'){
    const val = act==='miok' ? (document.getElementById('_mi')||{}).value||'' : v;
    document.querySelectorAll('.modal-mask').forEach(m=>m.remove());
    const cb=S._cb; S._cb=null; if(cb) cb(val); else render();
    return;
  }
  /* 四象限选择器：一次点击 → 拆成 imp / urg 两个字段写回（存储层不变） */
  if(act==='qpick'){
    document.querySelectorAll('.modal-mask').forEach(m=>m.remove());
    const cb=S._cb; S._cb=null;
    const imp=v?(v[0]==='1'):null, urg=v?(v[1]==='1'):null;
    if(cb) cb(imp,urg); else render();
    return;
  }
  /* 日历翻月（M1：真实年月，不再锁死 2026-10） */
  if(act==='calm'){
    let m=S.calM+(+v), y=S.calY;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    S.calY=y; S.calM=m; render(); return;
  }
  if(act==='focus'){ if(!S.focused){S.focused=true; S._panelIn=true; render();} return; }
  if(act==='blur'){ S.focused=false; render(); return; }

  if(act==='toggle'){ e.stopPropagation();
    const t=todos.find(x=>x.id==v); if(t){
      t.done=!t.done;
      t.doneAt = t.done ? nowStamp() : null;   /* M1：真实系统时间，不再取硬编码日期 */
      S._fx={id:t.id,done:t.done};             /* 刚动过的这条，重画后播勾选动效（动效 ④） */
      render(true);
    }
    return;
  }
  /* 弹窗里点条目 → 关掉弹窗再进详情（否则详情被弹窗盖着看不见） */
  if(act==='open'){
    document.querySelectorAll('.modal-mask').forEach(m=>m.remove());
    S.sub='detail'; S.detailId=+v; render(); return;
  }
  /* 日历页筛选：独立弹窗（FR-406 第二屏） */
  if(act==='calfilter'){ openCalFilter(); return; }
  /* ⚠️ 这四个都用 refreshCalBar()（= 重画条件区 + 结果区），**不是** render()：
     render 只重画页面主体，弹窗是挂在主体之外的另一块 DOM，点了不会变 ——
     之前就栽在这儿：选中态要退出弹窗再进来才看得见。 */
  if(act==='calclear'){ S.calQ=''; S.calFq=''; S.calFcat=''; S.calFst=''; S.calScope='month';
    refreshCalBar(); const p=document.getElementById('_cqs'); if(p) p.value=''; return; }
  if(act==='calscope'){ S.calScope=(v==='all'?'all':'month'); refreshCalBar(); return; }
  if(act==='calfq'){   S.calFq  =(S.calFq===v  ?'':v); refreshCalBar(); return; }
  if(act==='calfcat'){ S.calFcat=(S.calFcat===v?'':v); refreshCalBar(); return; }
  if(act==='calfst'){  S.calFst =(S.calFst===v ?'':v); refreshCalBar(); return; }
  /* 点「记一笔」栏 = 立刻聚焦，等价于原来的悬浮 + 号 */
  if(act==='tab'){ S.tab=v; S.sub=null; if(v==='note'){ S.focused=true; S._panelIn=true; } render(); return; }
  /* 切域：归属跟着当前域走（聚焦态下自动就是「工作」或「生活」，不用再点一次）；
     但如果你手动选过归属，就尊重你的选择，不跟着切 */
  if(act==='domain'){
    S.domain=v;
    if(S.parse && !(S.parse.manual && S.parse.manual.domain)) S.parse.domain=v;

  if(act==='cenctoggle'){
    SYNC.cfg.enc=!CLOUD.encOn(SYNC.cfg); SYNC.save();
    toast(SYNC.cfg.enc
      ? (SYNC.cfg.pwd ? '已开启 · 下次上传前会加密' : '已勾选 · 填上同步口令后才会真的加密')
      : '已关闭 · 云端会存明文');
    render(true); return;
  }
  if(act==='ctest'){
    const c=SYNC.cfg;
    if(!SYNC.filled()){ toast('上面的连接信息都填了才测'); return; }
    modal('正在测试连接…','正在真读写一次，请稍等…');
    CLOUD.test(c).then(r=>{
      if(r.ok) modal('连接成功 ✓',`<b>${esc(r.msg)}</b><br><br>这次结果来自一次真实的读写调用，不是猜的。<br>现在可以点【保存并开启】了。${cloudDiag(r)}`);
      else modal('连不上',`${r.msg}${cloudDiag(r)}`);
    });
    return;
  }
  if(act==='csave'){
    const c=SYNC.cfg;
    if(!SYNC.filled()){ toast('连接信息还差一样，填完再开'); return; }
    modal('正在开启…','先测得通，才允许开启');
    CLOUD.test(c).then(async r=>{
      if(!r.ok){ modal('没能开启', r.msg+cloudDiag(r)); return; }
      c.on=true; c.space=''; SYNC.save();
      SYNC.say('wait','已开启 · 正在第一次同步');
      render();
      const res=await SYNC.run({manual:true});
      toast(res.ok?'云同步已开启 ✓':'已开启，但第一次同步没成功');
      render();
    });
    return;
  }
  if(act==='csync'){
    if(!SYNC.ready()){ toast('先填完三样并保存'); return; }
    toast('正在同步…');
    SYNC.run({manual:true}).then(r=>{ toast(r.ok?'同步好了 ✓':'同步没成 · '+SYNC.st.msg); render(); });
    return;
  }
  if(act==='cfix'){
    if(!SYNC._pending){ toast('冲突已经解开了'); render(); return; }
    modalOptions('两台设备都改过',[
      ['local','以本机为准 · 把这台的推上去'],
      ['cloud','以云端为准 · 拉下来覆盖本机']],
      v=>{ SYNC.run({manual:true, prefer:v}).then(r=>{ toast(r.ok?'处理好了 ✓':'没处理成'); render(); }); });
    return;
  }
  if(act==='ccode'){
    if(!SYNC.filled()){ toast('先把连接信息填完'); return; }
    const code=SYNC.code();
    /* 两家的配置都塞进去了 —— 另一台导入后想用哪家都行 */
    const hasCos=!!(SYNC.cfg.cos.bucket&&SYNC.cfg.cos.secretId&&SYNC.cfg.cos.key);
    const hasSupa=!!(SYNC.cfg.supabase.base&&SYNC.cfg.supabase.key);
    const what=[hasCos?'腾讯云 COS':null, hasSupa?'Supabase':null].filter(Boolean).join(' ＋ ');
    const tip=`里面含：<b>${esc(what)}</b> 的连接信息 + 同步口令。<br>
      另一台【导入配置码】粘进去，这些框会<b>一次填好</b>，不用一项一项填。<br>
      ⚠️ <b style="color:#DC2626">它等于钥匙</b> —— 别发群、别存网盘。`;
    if(copyText(code)) modal('配置码已复制', tip);
    else modal('配置码（请手动复制）',
      `<textarea class="tin" style="height:90px">${esc(code)}</textarea>` + tip);
    return;
  }
  if(act==='cincode'){
    modalInput('粘贴另一台的配置码','DBSYNC1:…','', async s=>{
      try{
        SYNC.applyCode(s);
        const miss=CLOUD.missing(SYNC.cfg);
        if(miss.length){ SYNC.save(); render();
          modal('这份配置码不完整','缺了：<b>'+esc(miss.join('、'))+'</b><br><br>把这几项自己补上就行。');
          return; }
        toast('已填入 · 正在测试…');
        const r=await CLOUD.test(SYNC.cfg);
        if(!r.ok){ modal('这份配置连不上', esc(r.msg)); return; }
        SYNC.cfg.on=true; SYNC.save(); render();
        const res=await SYNC.run({manual:true});
        toast(res.ok?('配置码导入成功 ✓ · '+(SYNC.cfg.kind==='cos'?'腾讯云 COS':'Supabase'))
                    :'导入了，但第一次同步没成');
        render();
      }catch(e){ modal('读不了这段配置码', esc(String((e&&e.message)||e))); }
    });
    return;
  }
  if(act==='cdisc'){ SYNC.clear(); toast('已断开云同步 · 回到纯本地，本机数据不丢'); render(); return; }
  if(act==='csql'){
    if(copyText(SQL_SETUP)) toast('建表脚本已复制 · 去后端一次粘一段');
    else modal('建表脚本',`<textarea class="tin" style="height:140px">${esc(SQL_SETUP)}</textarea>`);
    return;
  }
  if(act==='quick'){S.tab='note';S.sub=null;render();setTimeout(()=>document.getElementById('qi')?.focus(),50);return;}
 }
 /* ⚠️ 这里是最后一道防线，别删（2026-10-21 加）：
    以前某个分支里万一写错一个变量名（比如导出生过 `scope is not defined`），
    异常只会掉进控制台，界面表现就是「点了没反应」—— 人根本不知道发生了什么。
    现在任何漏网的错都会在界面上说出来，同时把现场留在控制台里方便查。 */
 catch(err){
   console.error('[handleAct] 这一步出错了：', err);
   try{ toast('这一步出了岔子：'+((err&&err.message)||err)); }catch(e2){}
 }
}
document.addEventListener('click', handleAct);

document.addEventListener('input',e=>{
  if(e.target.id==='qi') S.input=e.target.value;
  /* V0.4 FR-406：搜索框边打边过滤 —— 只重画列表，不动输入框（保住光标和焦点） */
  if(e.target.id==='_qs'){ S.q=e.target.value; refreshNoteList(); }
  /* 日历弹窗里的搜索框：走独立条件，只重画弹窗里的结果区 */
  if(e.target.id==='_cqs'){ S.calQ=e.target.value; refreshCalList(); }
  if(e.target.dataset.cf){                       /* 支持 supabase.key / cos.bucket 这种点路径 */
    const ks=String(e.target.dataset.cf).split('.'), v=e.target.value;
    let cur=SYNC.cfg;
    for(let i=0;i<ks.length-1;i++){ if(cur[ks[i]]==null) cur[ks[i]]={}; cur=cur[ks[i]]; }
    cur[ks[ks.length-1]]=v;
    SYNC.save();
  }
  /* V0.2：AI 三个框实时写入（Key 落盘时即混淆）；改动后失效，"必须重测才给用"。
     select 触发的是 change 不是 input，所以两个都要听 */
  const aiKey = e.target && e.target.dataset ? e.target.dataset.ai : null;
  if(aiKey){
    AI.cfg[aiKey]=e.target.value;
    AI.cfg.ok=false; AI.cfg.msg=''; AI.save();
  }
});
document.addEventListener('change',e=>{
  /* V0.3：云同步的下拉（比如 COS 的地域）也要实时存下来 */
  const cfKey = e.target && e.target.dataset ? e.target.dataset.cf : null;
  if(cfKey){                                     /* 下拉（地域）也按点路径存 */
    const ks=String(cfKey).split('.'), v=e.target.value;
    let cur=SYNC.cfg;
    for(let i=0;i<ks.length-1;i++){ if(cur[ks[i]]==null) cur[ks[i]]={}; cur=cur[ks[i]]; }
    cur[ks[ks.length-1]]=v;
    SYNC.save(); render(); return;
  }
  const aiKey = e.target && e.target.dataset ? e.target.dataset.ai : null;
  if(aiKey){
    AI.cfg[aiKey]=e.target.value;
    AI.cfg.ok=false; AI.cfg.msg=''; AI.save();
    toast('模型已改成 '+e.target.value+' · 记得再测一次连接');
    render();
  }
});
/* 点输入框（或用 Tab 键切进来）→ 进入 A2 输入态
   ⚠️ 这里**必须**也置 S._panelIn：真实点击的顺序是「浏览器先给输入框焦点 → focusin 先跑 → 再才轮到 click」。
   要是这里漏了，focusin 那次 render 没有面板动画，等 click 走到 act==='focus' 时 S.focused 已经是 true
   直接 return，于是**手动点输入框永远看不到下拉动画**（只有切页面进来才有）—— 2026-10-21 修 */
document.addEventListener('focusin',e=>{
  if(e.target.id==='qi' && !S.focused){ S.focused=true; S._panelIn=true; render(); }
});
/* Esc 收起键盘 → 回到 A1 */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && S.focused){ S.focused=false; render(); }
  /* V0.4 FR-406：Esc 也能一步清掉搜索和筛选 */
  /* Esc = 收起筛选（等价于点框外）；已经收起了再按一次 = 连条件一起清掉 */
  if(e.key==='Escape' && S.tab==='note' && !S.sub){
    if(S.qOpen){ S.qOpen=false; render(true); }
    else if(hasFilter()){
      clearFilter(); const w=document.getElementById('searchwrap');
      if(w) w.innerHTML=searchHTML(); refreshNoteList();
    }
  }
});

/* ============ 分类长按拖动排序 ============
   落点算法（V0.2 修正）：
   to = 指针越过中线的行数（-1 表示在最顶上）。插在「第 to 行之后」。
   因为先删后插，**往上拖的时候目标索引要少算一位**，否则会落到错误的一侧：
   拖 C 到 A、B 中间，老算法得到 [C,A,B]，正确应该是 [A,C,B]。 */
let _dt=null,_drag=null;
function catRows(domain){
  return [...document.querySelectorAll('.cat-row')].filter(r=>r.dataset.domain===domain);
}
/* 由 to（越过行数）算出「删掉原元素后应该插到第几位」 */
function dropIndex(from,to){ return from < to+1 ? to : to+1; }
function clearDropMark(){
  document.querySelectorAll('.cat-row').forEach(r=>r.classList.remove('dropline','dropafter'));
}
document.addEventListener('pointerdown',e=>{
  const row=e.target.closest('.cat-row'); if(!row) return;
  _dt=setTimeout(()=>{                       /* 长按 400ms 进入拖动 */
    _drag={row,domain:row.dataset.domain,from:+row.dataset.idx,to:+row.dataset.idx};
    row.classList.add('dragging');
  },400);
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!_drag) return;
  e.preventDefault();
  const rows=catRows(_drag.domain);
  let to=-1;                                  /* -1 = 指针在第一行中线以上 → 插到最顶 */
  rows.forEach((r,i)=>{ const b=r.getBoundingClientRect(); if(e.clientY>b.top+b.height/2) to=i; });
  _drag.to=to;
  /* 实时画出插入位置：一条线，让你看清楚到底落在哪两项中间 */
  clearDropMark();
  const di=dropIndex(_drag.from,to);
  const domIdx=di+(_drag.from<di?0:1);        /* 换回当前 DOM 里的行号（还没删元素） */
  if(domIdx>=rows.length){ if(rows.length) rows[rows.length-1].classList.add('dropafter'); }
  else rows[Math.max(0,domIdx)].classList.add('dropline');
},{passive:false});
function endDrag(){
  if(_dt){clearTimeout(_dt);_dt=null;}
  if(!_drag) return;
  const {domain,from,to,row}=_drag;
  row.classList.remove('dragging'); _drag=null; clearDropMark();
  S._suppressClick=true; setTimeout(()=>S._suppressClick=false,120);  /* 别把拖动当成点击 */
  const arr=CATS[domain];
  if(!arr || from<0 || from>=arr.length) return;
  const di=dropIndex(from,to);
  if(di!==from){
    const [x]=arr.splice(from,1); arr.splice(di,0,x);
    toast('顺序已更新 · 选择分类时也是这个顺序');
    render(true);
  }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);   /* 手指被系统打断也要收尾，不然会卡在拖动态 */

/* 手机返回键：先退一层（详情页 / 二级页 → 上一级），退不了才由系统退出。
   网页里用不到它，但有了它 APK 里的手感才跟网页一致 */
window.__androidBack = function(){
  try{
    if(document.querySelector('.modal-mask')){
      document.querySelectorAll('.modal-mask').forEach(m=>m.remove()); return true;
    }
    if(S.sub){ S.sub=null; render(); return true; }
    if(S.focused){ S.focused=false; S.parse=null; render(); return true; }
  }catch(e){}
  return false;
};

/* ---- 启动（V0.2 · FR-025）：先读本机数据，读不到才用种子 ---- */
(function init(){
  const d=DB.load();
  if(d && Array.isArray(d.todos)){
    todos=d.todos;
    reviews=d.reviews||{};
    if(d.CATS){ CATS.work=d.CATS.work||CATS.work; CATS.life=d.CATS.life||CATS.life; }
    if(d.CAT_STYLE) Object.assign(CAT_STYLE,d.CAT_STYLE);
    if(d.lastPurge) DB.lastPurge=d.lastPurge;
    todos.forEach(t=>{ if(!t.manual) t.manual={}; if(t.createdAt==null) t.createdAt=nowStamp(); });
  }else{
    /* V0.4 交付版：**新装 App 就是空的**，不再预塞十几条示例数据 ——
       那些只是开发期为了看效果做的演示数据，会让人以为是自己不小心存的。
       演示用的种子数据仍留在 seed() 里，测试脚本需要时自己调它。 */
    todos=[]; DB.save();
  }
  const n=new Date();
  S.calY=n.getFullYear(); S.calM=n.getMonth();
  if(!S.day) S.day=TODAY;
  /* V0.2 启动三件事：
     ① 读 AI 配置（Key 混淆着存，源码里没有它的影子）
     ② 写一份当天快照 —— 本地自动备份的唯一触发点，不用你点任何东西
     ③ 回溯补复盘：昨天没生成的会补；连着好几天没开，最近 7 天依次往前补 */
  AI.load();
  BAK.snapshot();
  REV.ensure();
  /* V0.4 启动第五件事：回收站到期清理（FR-404）。每月扫一次，删前告知条数 */
  const _purged=TRASH.purge();
  if(_purged) setTimeout(()=>toast('回收站清理了 '+_purged+' 条（超过 '+TRASH.DAYS+' 天）'), 900);
  /* V0.3 启动第四件事：**先拉后**。延迟一点，别拖慢首屏；
     没开同步/断网/后端挂了都只是状态栏一行字，界面照常出现（硬规则 13） */
  UPD.load();
  SYNC.load();
  setTimeout(()=>{ SYNC.run().catch(()=>{}); },600);
  /* V0.4 FR-401：延迟静默查一次更新。有新版本只在当天提醒一次，不弹窗打扰 */
  setTimeout(()=>{
    UPD.check().then(r=>{
      if(r==='new' && UPD.st.today!==TODAY){
        UPD.st.today=TODAY; UPD.save();
        toast('有新版本 '+UPD.st.latest+' · 去「我的 → 检查更新」升级');
      }
    }).catch(()=>{});
  },3000);
})();
render();
/* 每 30 秒看一眼：翻过零点就把「今天」更新掉并重画一次。
   TODAY 一旦过期，逾期判定和「今天」这一组列表全是昨天的口径，看着像数据错了。 */
setInterval(()=>{ const d=fmtD(new Date()); if(d!==TODAY){ TODAY=d; render(true); } },30000);
setInterval(()=>{const d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');},1000);
/* 网络回来的第一时间补传 */
window.addEventListener('online',()=>{ SYNC.schedule(); });
</script>
