<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>个人待办清单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#E9EDF2;display:flex;align-items:center;justify-content:center;padding:24px;gap:24px;flex-wrap:wrap}

:root{
  --q1:#DC2626; /* 重要且紧急 · 马上做 */
  --q2:#2563EB; /* 重要不紧急 · 计划做 */
  --q3:#F59E0B; /* 紧急不重要 · 快速处理 */
  --q4:#94A3B8; /* 不紧急不重要 · 有空再说 */
  --ink:#111827; --ink2:#475569; --ink3:#64748B; --ink4:#94A3B8;
  --line:#E5E7EB; --line2:#CBD5E1; --card:#FFFFFF;
  --reviewbg:#F1F5F9;
}
.theme-work{--brand:#2563EB;--brand2:#4F8FF7;--bg:#F8FAFC;--r:12px;--pad:14px;--rin:18px;--gap:8px;--soft:#EFF6FF;--brandink:#1D4ED8}
.theme-life{--brand:#F2784B;--brand2:#FF9464;--bg:#FFFBF5;--r:24px;--pad:20px;--rin:28px;--gap:8px;--soft:#FEF1E7;--brandink:#C2410C}
/* 第③栏「我的」：设置与域无关 —— 中性配色，不蓝也不珊瑚 */
.theme-neutral{--brand:#64748B;--brand2:#94A3B8;--bg:#FFFFFF;--r:12px;--pad:14px;--rin:18px;--gap:8px;--soft:#F1F5F9;--brandink:#334155}

/* ---------- 手机外壳 ---------- */
.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;overflow:hidden;
  box-shadow:0 24px 60px rgba(15,23,42,.28);display:flex;flex-direction:column;position:relative;flex:none}
.statusbar{height:62px;flex:none;display:flex;align-items:flex-start;padding:20px 24px 0;font-size:15px;
  font-weight:600;color:var(--ink);position:relative}
.sb-right{position:absolute;right:24px;top:25px;display:flex;gap:6px;align-items:center}
.sb-right i{display:block;background:var(--ink);border-radius:1px}
.sb-sig{width:18px;height:12px;display:flex;align-items:flex-end;gap:2px}
.sb-sig i{width:3px}
.sb-wifi{width:16px;height:12px;background:none!important;border:2px solid var(--ink);border-radius:2px;position:relative}
.sb-wifi::after{content:"";position:absolute;left:3px;top:2px;width:6px;height:6px;border:2px solid var(--ink);border-radius:50%}
.sb-bat{width:26px;height:13px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.sb-bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.5px;top:1.5px;width:16px;height:7px;background:var(--ink);border-radius:1px}

.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 16px}
.view::-webkit-scrollbar{width:0}
.tabbar{flex:none;height:95px;display:flex;align-items:flex-start;justify-content:center;padding:12px 12px 0;
  background:var(--bg)}
.tabcapsule{width:min(348px,100%);height:62px;background:#fff;border:1px solid var(--line);border-radius:36px;
  display:flex;padding:4px;box-shadow:0 4px 14px rgba(15,18,39,.08);position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:32px;font-size:13px;color:var(--ink4);cursor:pointer;background:none;border:none;
  font-family:inherit;font-weight:500;position:relative;z-index:1}
/* 选中态的**底色**交给 .pill 那块会滑过去的药丸（见「衔接动效」一节），这里只管把字变白 */
.tab.on{background:none;color:#fff;font-weight:600;box-shadow:none}
.tab svg{width:20px;height:20px}

/* ---------- 域切换器 ---------- */
.switch{width:100%;height:56px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:5px;
  display:flex;gap:4px;margin-top:8px;box-shadow:0 4px 14px rgba(15,18,39,.08);flex:none;position:relative}
/* 灰色静态态：左右两半各占一边，都不可点 */
.switch.neutral{background:#F1F5F9;border-color:#E2E8F0;box-shadow:none}
.sw-half.neutral{color:#94A3B8;cursor:default}
.sw-half{flex:1;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;border:none;cursor:pointer;font-family:inherit;color:var(--ink4);font-weight:500;background:none;
  position:relative;z-index:1}
/* 同底部 Tab：底色由 .pill-sw 那块药丸滑动承担 */
.sw-half.on{background:none;color:#fff;font-weight:600;box-shadow:none}
.sw-half svg{width:20px;height:20px}

/* ---------- 域切换器固定栏（2026-10-18 主人要求）----------
   跟底部 Tab 栏一样常驻不滚动：以前切换器写在每一屏的最上面，跟着 .view 一起滚走了。
   现在它是 .phone  flex 列里的独立一栏（render() 往里灌内容），
   二级页（详情/收件箱/设置项）照旧隐藏，行为与旧版一致。 */
.domainbar{flex:none;padding:12px 16px 4px;background:var(--bg)}
.domainbar .switch{margin-top:0}

/* ---------- 通用卡片 / 行 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.grouptitle{font-size:13px;font-weight:600;color:var(--ink);margin:6px 2px 0}
.stack{display:flex;flex-direction:column;gap:var(--gap);padding-top:12px}

/* ---------- 输入框 ---------- */
.inputbox{background:#fff;border:2px solid var(--brand);border-radius:var(--rin);padding:18px;
  display:flex;align-items:flex-start;gap:12px}
.inputbox textarea{flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:17px;
  line-height:24px;color:var(--ink);background:none;min-height:48px}
.inputbox textarea::placeholder{color:var(--ink4)}
.aibtn{width:44px;height:44px;flex:none;border-radius:22px;background:var(--brand);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.hint{font-size:11px;color:var(--ink4);line-height:16px;padding:2px 4px 0}

/* ---------- 条目行 ---------- */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);
  display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.circle{width:20px;height:20px;flex:none;border:1.5px solid var(--line2);border-radius:10px;position:relative;cursor:pointer}
.circle::after{content:"";position:absolute;inset:-12px} /* 44px 热区 */
.circle.done{background:var(--brand);border-color:var(--brand)}
.circle.done::before{content:"";position:absolute;left:5px;top:3px;width:6px;height:10px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.qbar{width:8px;height:42px;flex:none;border-radius:4px}
.itxt{flex:1;min-width:0}
/* 标题 / 副标题各占一行：它们是 span（inline），不显式块化的话副标题会挤进标题同一行 */
.ititle{display:block;font-size:15px;font-weight:500;color:var(--ink);line-height:1.3}
.isub{display:block;font-size:12px;color:var(--ink3);margin-top:4px}
/* 标记完成后：整条转灰 + 沉到当日最下方，但不消失 */
.item.done{background:#F8FAFC}
.item.done .ititle{color:var(--ink4);text-decoration:line-through}
.item.done .isub{color:var(--ink4)}
.item.done .qbar{opacity:.45}

/* ---------- 字段行 ---------- */
.field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;
  align-items:center;gap:12px}
button.field{width:100%;text-align:left;font-family:inherit;cursor:pointer}
button.field:hover{background:#F8FAFC;border-color:var(--brand2)}
.fname{font-size:13px;color:var(--ink3);width:72px;flex:none}
.fval{flex:1;font-size:14px;font-weight:500;color:var(--ink)}
.fact{font-size:12px;font-weight:500;color:var(--brand)}

/* ---------- 悬浮按钮 ---------- */
.fab{position:absolute;right:26px;bottom:120px;width:56px;height:56px;border-radius:28px;
  background:var(--brand);border:none;color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;z-index:20}
.fab.badge::after{content:attr(data-n);position:absolute;top:-2px;right:-2px;min-width:24px;height:24px;
  background:#DC2626;border-radius:12px;font-size:12px;font-weight:600;display:flex;align-items:center;
  justify-content:center;padding:0 6px;border:2px solid var(--bg)}
.fabplus{background:#fff;box-shadow:0 6px 16px rgba(15,23,42,.24)}

/* ---------- 日历 ---------- */
.calgrid{display:flex;flex-direction:column;gap:2px}
.calweek{display:flex;gap:2px}
.calhead{display:flex;gap:2px;margin-bottom:2px}
.calhead div{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--ink3)}
.cell{flex:1;min-width:0;width:auto;height:52px;border-radius:10px;padding:4px;display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;border:none;background:none;font-family:inherit;position:relative}
.cell.empty{cursor:default}
.cellnum{font-size:13px;font-weight:500;color:var(--ink)}
.cellstat{font-size:9px;color:var(--ink3);display:flex;align-items:center;gap:1px}
.cellstat b{font-weight:400;font-size:9px}
.cellstat i{font-style:normal;font-size:6px}
.cell.hasreview{background:var(--reviewbg)}
.cell.today{background:var(--soft);border:1.5px solid var(--brand)}
.cell.today .cellnum{color:var(--brandink);font-weight:700}
.cell.sel{outline:2px solid var(--brand)}
.underline{width:22px;height:3px;border-radius:1.5px;background:#DC2626;margin-top:auto}

/* ---------- 复盘 ---------- */
.reviewbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.reviewtext{background:var(--reviewbg);border-radius:10px;padding:10px;font-size:13px;line-height:20px;color:var(--ink)}
.reviewmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--ink3)}
.regen{border:1px solid var(--line2);background:none;border-radius:8px;padding:4px 10px;font-size:11px;
  color:var(--ink2);cursor:pointer;font-family:inherit}

/* ---------- 按钮 ---------- */
.btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;border:none;
  font-weight:600;background:var(--brand);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line2);color:var(--ink2);font-weight:500}
.btnrow{display:flex;gap:10px}

/* ---------- 输入 ---------- */
.tin{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;
  font-family:inherit;background:#fff;color:var(--ink);outline:none}
.tin:focus{border-color:var(--brand)}
.label{font-size:13px;color:var(--ink3);padding:2px 2px 0}
.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pagetitle{font-size:20px;font-weight:700;color:var(--ink);padding:4px 2px}
.backrow{display:flex;align-items:center;gap:8px;padding:8px 0 0}
.backbtn{width:20px;height:20px;border:none;background:none;cursor:pointer;color:var(--ink)}
.segbar{display:flex;gap:8px;background:var(--soft);border-radius:10px;padding:10px;font-size:13px;color:var(--ink2)}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px}
.sw.w{background:#2563EB}.sw.l{background:#F2784B;border-radius:7px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;background:rgba(17,24,39,.92);
  color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;z-index:50;max-width:300px;text-align:center}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:#fff;cursor:pointer;font-size:14px;font-family:inherit;width:100%;text-align:left}
.opt.on{border-color:var(--brand);background:var(--soft)}
.radio{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:9px;flex:none;position:relative}
.opt.on .radio{border-color:var(--brand);background:var(--brand)}
.opt.on .radio::after{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;background:#fff;border-radius:4px}
/* 筛选条件胶囊：一律单行、图标与文字横排（分类独占一行之后，原来会把文字挤到 emoji 下面） */
.tagpill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  font-size:11px;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--brandink)}
.tagpill .cat-chip{width:20px;height:20px;font-size:12px;border-radius:6px}
.emptybox{text-align:center;color:var(--ink4);font-size:13px;padding:24px 0}

/* ---------- A1 / A2 输入态 ---------- */
.inputbox.focused{border-width:3px;box-shadow:0 0 0 4px var(--soft)}
.kbd-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--soft);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink3)}
.kbd-bar button{border:none;background:none;color:var(--brand);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;flex:none}
/* 日期选择用的小月历 */
.dp-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.dp-head span{text-align:center;font-size:11px;color:var(--ink3)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-cell{aspect-ratio:1;border:none;background:none;border-radius:8px;font-size:12px;
  color:var(--ink);cursor:pointer;font-family:inherit;padding:0}
.dp-cell:hover{background:var(--soft)}
.dp-cell.sel{background:var(--brand);color:#fff;font-weight:600}
.dp-cell.today{outline:1px solid var(--brand2)}

/* 分类颜色 / 符号选择器 */
.sw-pick{width:28px;height:28px;border-radius:8px;border:none;cursor:pointer}
.sw-sym{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-size:14px;color:var(--ink);font-family:inherit}
/* 分类小徽章：emoji 本身是彩色的，改不动颜色 —— 所以把颜色作用在**底衬 + 左侧竖条**上 */
.cat-chip{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex:none}
/* 长按拖起来排序 */
/* 四象限选择器 = 一个真的数学象限：
   两条坐标轴从四格**中间的缝隙**穿过，字挂在轴的上下 / 左右两端 */
.quad-modal{max-width:360px}
.quadwrap{position:relative;padding:18px 46px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qcross-h{position:absolute;left:46px;right:46px;top:50%;height:2px;margin-top:-1px;
  background:var(--line2);border-radius:1px}
.qcross-v{position:absolute;top:18px;bottom:18px;left:50%;width:2px;margin-left:-1px;
  background:var(--line2);border-radius:1px}
.qlab{position:absolute;font-size:11px;color:var(--ink3);white-space:nowrap}
.qlab-t{top:0;left:50%;transform:translateX(-50%)}
.qlab-b{bottom:0;left:50%;transform:translateX(-50%)}
.qlab-l{left:0;top:50%;transform:translateY(-50%)}
.qlab-r{right:0;top:50%;transform:translateY(-50%)}
/* 未选中也带淡色底（一眼看懂每格是什么）；选中只多一层描边 + 右上角对勾 */
.qcell{position:relative;min-height:104px;border:2px solid transparent;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;
  cursor:pointer;transition:transform .1s}
.qcell.on{border-width:3px}
.qcell:active{transform:scale(.97)}
.qcell .qname{font-size:15px;font-weight:600;white-space:nowrap}
.qcell .qdesc{font-size:10px;color:var(--ink3);white-space:nowrap}
.qcell .qcheck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:10px;
  color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
/* 「手填」角标：这格是你自己填的，重新解析不会覆盖它 */
.mtag{font-style:normal;font-size:10px;line-height:1;border:1px solid var(--line2);color:var(--ink3);
  border-radius:4px;padding:2px 3px;margin-left:5px;vertical-align:middle}
.cat-row{transition:transform .12s}
.cat-row.dragging{opacity:.55;transform:scale(1.03);box-shadow:0 10px 22px rgba(15,23,42,.22);
  cursor:grabbing;touch-action:none}
/* 拖动时画出「会落在哪一项之前 / 之后」，别让人靠猜 */
.cat-row.dropline{box-shadow:inset 0 3px 0 0 var(--brand)}
.cat-row.dropafter{box-shadow:inset 0 -3px 0 0 var(--brand)}

/* ---------- 衔接动效（2026-10-20 · V0.4 打磨）----------
   原则：只做「进」不做「出」—— 关闭 / 取消一律瞬时完成，不拖手感，测试也不用等动画；
   时长压在 180~340ms（iOS 同档），缓动统一用先快后慢的曲线，别抢内容的戏。 */

/* ① 统一按压反馈：可点元素按下轻缩、松手弹回 */
.row,.item,.btn,.tab,.sw-half,.opt,.aibtn,.fab,.cell,.regen,.backbtn,.sw-pick,.sw-sym,.tagpill,.dp-cell,button.field{
  transition:transform .12s ease}
.row:active,.item:active,.btn:active,.tab:active,.sw-half:active,.opt:active,.aibtn:active,
.cell:active,.regen:active,.backbtn:active,.sw-pick:active,.sw-sym:active,.tagpill:active,
.dp-cell:active,button.field:active{
  transform:scale(.97)}
.fab{transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.fab:active{transform:scale(.88)}
.tab,.sw-half{transition:transform .12s ease,color .22s ease}

/* ⑧ 药丸滑块：Tab 栏 / 域切换器的选中态是**一块会滑过去**的药丸，不是各自瞬间换底色。
   底栏每次 render 都重建，transition 用不上 → 把「上一格是第几个」写进 --f，用 animation 滑过去。
   宽度写成格数的倒数（Tab 三格 / 域两格），translateX(100%) 正好移动一格。 */
/* 底色用 background-color（**能插值**）+ 一层半透明白做「左亮右深」的渐变质感 ——
   原来的 linear-gradient(var(--brand2),var(--brand)) 是图片，切域时只能瞬间跳色，
   没法跟滑动一起渐变。改成纯色后，--fc（旧色）→ --brand（新色）就能一路过渡过去。 */
.pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:32px;pointer-events:none;
  background-color:var(--brand);
  background-image:linear-gradient(90deg,rgba(255,255,255,.26),rgba(255,255,255,0) 72%);
  box-shadow:0 6px 14px -4px rgba(0,0,0,.25);
  /* 每格步进 = 自身宽 + 格间距（域切换器两格之间有 4px gap，Tab 栏没有） */
  transform:translateX(calc(var(--i,0) * (100% + var(--g,0px))))}
.pill-tab{width:calc((100% - 8px)/3)}
.pill-sw{top:5px;bottom:5px;left:5px;border-radius:23px;width:calc((100% - 14px)/2);--g:4px;
  box-shadow:0 6px 14px -4px rgba(0,0,0,.3)}
/* 移动 + 换色同时进行：位置从旧格到新格，颜色从旧域的色到新域的色 */
@keyframes pillmove{
  from{transform:translateX(calc(var(--f,0) * (100% + var(--g,0px))));
       background-color:var(--fc,var(--brand))}
  to{transform:translateX(calc(var(--i,0) * (100% + var(--g,0px))));
     background-color:var(--brand)}}
/* 没挪位置但颜色变了（切域时底栏 Tab 的药丸就待在原格）→ 只播换色 */
@keyframes pilltint{from{background-color:var(--fc,var(--brand))}to{background-color:var(--brand)}}
.pill.mv{animation:pillmove .3s cubic-bezier(.22,.85,.3,1)}
.pill.tint{animation:pilltint .34s ease}

/* ② 页面切换进场：整屏轻移 + 淡入（render() 按方向挂类；同页原地更新不播，勾一条不该整屏晃） */
@keyframes pageinF{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pageinB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pageinU{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.pagein-f{animation:pageinF .28s cubic-bezier(.22,.85,.3,1)}
.view.pagein-b{animation:pageinB .28s cubic-bezier(.22,.85,.3,1)}
.view.pagein-u{animation:pageinU .24s cubic-bezier(.22,.85,.3,1)}

/* ③ A2 聚焦面板展开：**整块**从输入框底下平移下来（不是一行行冒出来 —— 那样太碎）。
   max-height 从 0 撑开 = 把下面的内容「推开」而不是瞬间跳位；再叠一点向下位移，
   看起来就是这块面板从上面那个框里被抽出来。 */
@keyframes panelopen{from{opacity:0;max-height:0;transform:translateY(-18px)}
                     to{opacity:1;max-height:640px;transform:none}}
.section.panelin{animation:panelopen .26s cubic-bezier(.22,.85,.3,1);overflow:hidden}
.inputbox{transition:box-shadow .25s ease}

/* ④ 勾选完成：圆圈 pop + 对勾画出 + 整条在新位置落定；取消完成用同一套反向感知 */
@keyframes cpop{0%{transform:scale(.55)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes checkin{from{opacity:0;transform:rotate(42deg) scale(.2)}to{opacity:1;transform:rotate(42deg) scale(1)}}
@keyframes itemset{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.item.fx-on .circle,.item.fx-off .circle{animation:cpop .34s cubic-bezier(.34,1.56,.64,1)}
.item.fx-on .circle.done::before{animation:checkin .26s ease both}
.item.fx-on,.item.fx-off{animation:itemset .32s ease}

/* ⑤ toast：底部滑入，退场前淡出下移（.bye 由 toast() 挂上） */
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toastin .22s cubic-bezier(.22,.85,.3,1)}
.toast.bye{opacity:0;transform:translate(-50%,8px);transition:opacity .24s ease,transform .24s ease}

/* ⑥ 弹窗：遮罩淡入 + 弹窗轻微放大落定；原地重建（选颜色 / 翻月历）不重播（.reinit） */
@keyframes maskin{from{opacity:0}to{opacity:1}}
@keyframes modalin{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.modal-mask{animation:maskin .18s ease}
.modal{animation:modalin .26s cubic-bezier(.2,.9,.35,1.12)}
.modal-mask.reinit,.modal.reinit{animation:none}

/* ⑦ 域切换：外壳 / 底栏 / 切换器的底色平滑过渡（切换时颜色是「渐变过去」不是「啪一下跳走」） */
.phone,.tabbar,.domainbar,.switch{transition:background-color .25s ease,border-color .25s ease}

/* ---------- 弹窗 ---------- */
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:24px}
/* max-height + overflow：内容再长也不会撑破手机屏（长弹窗撑出去会让整页看着「乱了」） */
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:300px;
  max-height:calc(100% - 40px);overflow:auto;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.modal-t{font-size:16px;font-weight:600;color:var(--ink)}
.modal-b{font-size:13px;line-height:20px;color:var(--ink2)}

/* 桌面说明卡 */
.notes{max-width:320px;font-size:13px;line-height:1.9;color:#334155;background:#fff;border-radius:16px;
  padding:20px 22px;box-shadow:0 8px 24px rgba(15,23,42,.10)}
.notes h3{font-size:15px;margin-bottom:8px;color:#0F172A}
.notes code{background:#F1F5F9;padding:1px 5px;border-radius:4px;font-size:12px}

/* ---------- APK 真机模式（放在样式表末尾：同特异性时后者胜，才能盖住前面的原型规则） ----------
   同一个 index.html 两种形态：
   · 电脑上双击打开 = 原型（手机外壳 + 右侧说明卡，照旧）
   · 安卓 APK 里打开 = app-mode（由文首脚本按 UA 认领）：
     外壳撑满整屏、去掉圆角阴影；假状态栏 / 桌面说明卡 /
     原型屏幕标签（A1·A2…）全部隐藏；页面不再比手机大、不能拖动。
   窄窗口（<900px，比如手机浏览器直接打开）自动走同一套撑满样式。 */
body.app-mode{padding:0;display:block;background:var(--bg);width:100vw;
  height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
body.app-mode .phone{width:100%;height:100%;border-radius:0;box-shadow:none;
  /* 让出手机真实状态栏 / 底部手势条（含刘海）：
     --sysbar-* 由安卓壳用原生 insets 注入（已除密度换算成 dp；真机实测 setFitsSystemWindows
     对 WebView 无效、且 WindowInsets 是物理像素不除密度会放大 2~3 倍，两个坑都踩过）；
     env(safe-area-inset-*) 是兜底（viewport-fit=cover 已开，手机浏览器直接打开时也管用）。
     min() 上限：真状态栏最高约 60dp（打孔屏），再大只可能是 ROM 报了离谱值 ——
     宁可内容贴一点，也不留一大块空白。变量没注入时（电脑/无头浏览器）两边都是 0，不留白。 */
  padding-top:min(var(--sysbar-top,env(safe-area-inset-top,0px)),96px);
  padding-bottom:min(var(--sysbar-bottom,env(safe-area-inset-bottom,0px)),48px)}
body.app-mode .statusbar,body.app-mode .notes{display:none!important}
@media (max-width:900px){
  body{padding:0;display:block;background:var(--bg);width:100vw;
    height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none;
    padding-top:min(env(safe-area-inset-top,0px),96px);
    padding-bottom:min(env(safe-area-inset-bottom,0px),48px)}
  .statusbar,.notes{display:none!important}
}
</style>

<script>
const APPVER = 'V0.4（M4 · 更新与配色）';

/* ============ 运行环境认领：网页原型 vs 安卓 APK ============
   壳里打开（UA 带 DaibanApp 标记，或存在 AppBridge）→ body 加 app-mode：

(function(){

/* ==================================================================
   V0.3 · 提示词 PROMPTS —— 全篇唯一写 AI 话术的地方
   ⚠️ 当前是草稿版 draft-1，**等你过目确认后才算定稿**。
   以后调语气 / 调规则，只改这个对象，其它代码一行都不用动。
   ================================================================== */
const PROMPTS = {
  /* ① 解析提示词：2026-10-14 你确认「就按这个」→ 定稿
     ② 复盘提示词：同日改成「俏皮吐槽风」→ 也已定稿，但想调随时说
     ③ 2026-10-18 解析规则 2 补凌晨特例（0~4 点「明天=当天」），定稿文档随之升为 V0.3 */
  v: 'V0.3 定稿（2026-10-14 解析按原文 / 复盘俏皮吐槽版；2026-10-18 补凌晨 0~4 点「明天=当天」特例）',

  /* ① 解析：一句原话 → 结构化字段 */
  parseSys: `你是中文待办助手，把用户的一句话拆成结构化字段。
只输出 JSON 本身，不要代码块围栏、不要解释。
格式：{"title":"","due":"YYYY-MM-DD 或 空","time":"HH:mm 或 空","dueText":"","imp":false,"urg":false,"cat":"","domain":"work 或 life"}

规则：
1. title：只留「要做什么」，去掉时间词、语气词、客套话，不超过 20 字。
2. due / time：依据【现在时刻】推算；支持 今天/明天/后天/下周X/N号/下个月/周X/X点/下午3点 等。
   没听出时间的，due 与 time 都返回空字符串，dueText 写「（没设时间）」。
   dueText 是给人看的，比如「明天 15:00」「10月18日」。
   【凌晨特例】若【现在时刻】在 00:00~03:59 之间：用户说的「明天/明早/明晚/明日」一律按**今天**
   推算（半夜说"明早交报告"要的是当天上午），「后天」按**明天**推算；04:00 及以后才按字面意思。
   这是主人的实际用法，与规则版 doParse 口径一致，必须遵守。
3. imp（重要）/ urg（紧急）**只有用户明确说出来才算 true**，没提就是 false：
   · imp=true 的信号：重要、关键、老板要看、关系考核、必须、要紧
   · urg=true 的信号：催、尽快、马上、来不及了、今天必须、临时插进来
   · 红线：**不能**因为截止日期近就判紧急，**不能**因为事情听起来大就判重要。
4. cat：只能从【可选分类】里挑一个最贴的；没有合适的就返回空字符串，**不许自己造分类名**。
5. domain：工作相关=work，生活琐事=life；判断不出按 work。
6. 一句话里有多件事时，只整理最靠前的那一件。`,
  parseUser: (text, cats, nowText) =>
`【现在时刻】${nowText}
【可选分类】${cats.length ? cats.join('、') : '（暂无分类）'}
【用户原话】${text}`,

  /* ② 复盘：全天跨域合并成一句话 —— 俏皮吐槽版（2026-10-14 定的调子） */
  reviewSys: `你是用户的私人复盘搭子，说话像个会损他的老朋友：能吐槽、能调侃，但始终站在他这边。
看当天的事实数据，写一句中文总结，40~70 字。

要求：
· 一句话，说人话。像朋友边笑边复述这一天，不像工作报告。
· 先说做完了什么（挑最有分量的一两件，**点名具体事项**），再说没做完的（如果有）。
· 吐槽只冲着「事」去，不冲着「人」：可以说「这报表比猫还难抓」，不许说「你又拖延了」。
· 允许俏皮：比喻、夸张、「吧、啊、嘿」这类口语都行，但别油腻、别卖萌、别连续用感叹号。
· 要给建议就给**明天马上能动手**的具体动作（点名具体事项），不要泛泛而谈。
· 事实可以直说，比如「这事已经在你眼皮底下溜了 3 天」—— 有素材的吐槽才好笑。

禁止：
· 报告腔：不要百分比、不要罗列数字（统计会单独显示在旁边，正文里别重复）。
· 考评腔：「有待提升」「表现不佳」。
· 鸡汤腔：「要保持积极心态哦～」「明天会更好」。
· 空话：「建议优化时间管理」「合理安排时间」。
· 人身指责与阴阳怪气：「你总是」「也就你能拖」（可以换成「这事拖了 3 天，比你想的顽强」）。

只输出这一句话本身，不要标题、不要引号、不要解释。`,
  reviewUser: (date, items) =>
`【日期】${date}
【当天计划】${items.total} 件
【已完成】${items.doneList.join('、') || '无'}
【未完成】${items.undoneList.join('、') || '无'}
【逾期还没做】${items.overdueList.join('、') || '无'}
【拖得最久的一件】${items.worst || '无'}${items.lateDays ? '（已经 '+items.lateDays+' 天）' : ''}`
};

/* ============ 数据 ============ */
const CATS = {
  work:['项目推进','会议沟通','报表材料','临时插单'],
  life:['家人','健康运动','缴费账单','采购']
};
/* 分类的颜色与符号（可自定义） */
const CAT_STYLE={};
const PALETTE=['#DC2626','#F59E0B','#10B981','#2563EB','#8B5CF6','#EC4899','#0891B2','#64748B'];
/* 符号用**具象物件**而不是几何图形 —— 一眼就知道这堆是什么事 */
const SYMBOLS=['💼','📊','📝','🖊️','📎','🗂️','💻','📈','🎯','📌','☎️','🧾','🔧','💡',
               '🏠','👨‍👩‍👧','❤️','🏃','🍎','🚗','💰','🛒','🧹','⏰'];
/* 没被用户改过的分类：按**名字本身**算出颜色和符号
   ⚠️ 不能像以前那样按「已经分配了几个」往下顺延 —— 那样手机和电脑上新建分类的先后不同，
   同一个分类会被分到不一样的颜色，一同步就互相跳。用名字算出来的结果，两台永远一致。 */
function catHash(s){ let h=2166136261; const x=String(s||'');
  for(let i=0;i<x.length;i++){ h^=x.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0; }
function catStyle(name){
  if(!CAT_STYLE[name]){
    const i=catHash(name);
    CAT_STYLE[name]={color:PALETTE[i%PALETTE.length], symbol:SYMBOLS[i%SYMBOLS.length]};
  }
  return CAT_STYLE[name];
}
/* hex → rgba，用来做淡底 */
function hexA(hex,a){
  const h=hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
/* 分类徽章：淡色底 + 左侧 3px 实心竖条，emoji 保持原色（不突兀又能区分） */
function catChip(name){
  const st=catStyle(name);
  return `<span class="cat-chip" style="background:${hexA(st.color,.14)};box-shadow:inset 3px 0 0 ${st.color}">${st.symbol}</span>`;
}
function catOpts(dm){
  return CATS[dm].map(c=>[c,c,catChip(c)]);
}
/* ---------- 日期与时刻：一律取真实系统时间，不再写死 ---------- */
const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const nowStamp=()=>fmtD(new Date())+' '+nowHM();
const shift=n=>{const d=new Date();d.setDate(d.getDate()+n);return fmtD(d);};

/* ---------- M1 存储层（唯一负责读写的模块）----------
   换 IndexedDB、或日后加云同步，都只改这一个地方，业务代码不动 */
const DB={
  KEY:'todo.v0.1',
  lastPurge:'',            /* V0.4 FR-404：回收站上次自动清理时间（每月最多扫一次） */
  load(){ try{ const s=localStorage.getItem(DB.KEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  save(){ try{ localStorage.setItem(DB.KEY, JSON.stringify({v:2,lastPurge:DB.lastPurge,todos,CATS,CAT_STYLE,reviews})); }catch(e){
    /* 存不下多半是空间满了 —— 先清最老的备份腾地方，再试一次 */
    BAK.prune(7); try{ localStorage.setItem(DB.KEY, JSON.stringify({v:2,lastPurge:DB.lastPurge,todos,CATS,CAT_STYLE,reviews})); }catch(e2){} }
  }
};

/* ==================================================================
   V0.4 · 回收站自动清理（FR-404）
   删掉的东西先在回收站躺 30 天；启动时扫一次、每月最多扫一次，不为难开机速度。
   ⚠️ 保守口径：没有删除时间（老数据）的条目**永远不动**，宁可留着也不误删。
   ================================================================== */
const TRASH={
  DAYS:30,
  purge(){
    try{
      const cur=TODAY.slice(0,7);                       /* YYYY-MM */
      if(DB.lastPurge && DB.lastPurge.slice(0,7)===cur) return 0;   /* 本月已扫过 */
      const cut=new Date(); cut.setDate(cut.getDate()-TRASH.DAYS);
      /* 只比日期、不比时刻：整 30 天的那条当天还能翻出来恢复，第 31 天才真删 */
      const cutDay=fmtD(cut);
      let n=0;
      for(let i=todos.length-1;i>=0;i--){
        const t=todos[i];
        if(!t.deleted) continue;
        if(!t.deletedAt) continue;                      /* 老数据没有删除时间 → 留着不动 */
        if(String(t.deletedAt).slice(0,10)>=cutDay) continue;   /* 还在期限内 → 可恢复 */
        todos.splice(i,1); n++;
      }
      DB.lastPurge=nowStamp();
      if(n) DB.save();
      return n;
    }catch(e){ return 0; }
  }
};

/* ==================================================================
   V0.2 · 本地自动备份（FR-018）
   「我的」里没有入口 —— 它是自动执行的：每次打开、每次保存都顺手写一份当天快照，
   保留最近 30 天 + 一份最新全量。**不含 API Key / 云密钥 / 背景图原文件**。
   ================================================================== */
const BAK = {
  PFX:'todo.bak.', KEEP:30, days:[],
  key(d){ return BAK.PFX+(d||fmtD(new Date())); },
  list(){ try{
      return Object.keys(localStorage).filter(k=>k.indexOf(BAK.PFX)===0).sort();
    }catch(e){ return []; } },
  snapshot(){
    const d=fmtD(new Date());
    const payload={v:2,at:nowStamp(),todos,CATS,CAT_STYLE,reviews};   /* 只放数据，不碰 AI.cfg / cloud */
    const s=JSON.stringify(payload);
    /* 数据量大时自动少留几天，别把本机存储撑爆（localStorage 一般只有 5~10 MB）*/
    const keep = s.length>200000 ? Math.max(7, Math.floor(2000000/s.length)) : BAK.KEEP;
    try{ localStorage.setItem(BAK.key(d),s); }catch(e){
      BAK.prune(3); try{ localStorage.setItem(BAK.key(d),s); }catch(e2){} }
    BAK.prune(keep);
  },
  prune(keep){
    const ks=BAK.list();
    while(ks.length>(keep||BAK.KEEP)){ try{ localStorage.removeItem(ks.shift()); }catch(e){break;} }
  },
  /* 断网/清数据后能不能救回来：给「我的」页显示用 */
  last(){ const ks=BAK.list(); return ks.length?ks[ks.length-1].slice(BAK.PFX.length):''; }
};

/* ==================================================================
   V0.3 · 云同步（FR-301~309）· 通道 A：自带后端（填地址 + 密钥 + 同步口令）
   两条铁律：
   ① **只用 fetch + WebCrypto** —— 不装 SDK、不拆文件、不加依赖，保持单文件能双击打开
   ② **它挂了 App 照常用** —— 任何失败都变成「状态栏一行字」，不弹错、不卡界面（硬规则 13）
   后端换哪家，只改 CLOUD 里的 getRow / putRow；SYNC 与界面一行都不动。
   ================================================================== */
const DEVID=(function(){
  try{ let d=localStorage.getItem('todo.devid');
    if(!d){ d='D'+Math.random().toString(36).slice(2,8).toUpperCase(); localStorage.setItem('todo.devid',d); }
    return d; }catch(e){ return 'DEV0'; }
})();

const CLOUD={
  SALT:'daiban.todo.sync.v1', ITER:100000, TIMEOUT:8000,
  b64url(u8){ let s=''; for(const b of u8) s+=String.fromCharCode(b);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  hash32(s){ let h=2166136261;
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    return (h>>>0).toString(36); },
  /* 同步口令 → space_id（256 位派生值）。**口令本身永远不上传**，云端只有这个算出来的串，
     所以别人拿到地址+密钥也找不到你的数据在哪一行。 */
  async sid(pwd){
    if(!pwd) return '';
    if(!(globalThis.crypto && crypto.subtle)) return 'weak'+CLOUD.hash32(pwd);   /* 极老环境兜底 */
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits(
      {name:'PBKDF2',salt:enc.encode(CLOUD.SALT),iterations:CLOUD.ITER,hash:'SHA-256'},km,256);
    return CLOUD.b64url(new Uint8Array(bits));
  },
  /* 两种后端的密钥**分开存放**，切服务商时不会串（cfg 是嵌套的；兼容老的扁平结构） */
  sb(cfg){ return cfg.supabase || cfg; },
  cc(cfg){ return cfg.cos || cfg; },
  hdr(cfg){ const k=String(CLOUD.sb(cfg).key||'').trim();
    /* HTTP 头里塞不下中文/全角符号 —— 不在这里拦住的话，会被当成"对方不给跨域"，把人带沟里 */
    if(k && /[^\x20-\x7E]/.test(k)) throw new Error('KEYCHAR');
    const h={apikey:k,'Content-Type':'application/json'};
    /* Supabase 新一代的 publishable key（sb_publishable_…）不是 JWT：
       塞进 Authorization: Bearer 会被当成 JWT 去解析、然后整条请求被拒。
       所以只有老式 JWT 密钥（eyJ 开头）才补 Bearer 头。 */
    if(/^eyJ/.test(k)) h['Authorization']='Bearer '+k;
    return h; },
  /* 这一家实际会去访问的地址 —— 显示给人看，方便核对桶名 / 地域 / 服务地址填对没 */
  at(cfg){ return CLOUD.isCOS(cfg)
      ? 'https://'+CLOUD.cosHost(cfg)+'/daiban/<你的口令派生出的文件名>.json'
      : CLOUD.url(cfg); },

  /* ---------- V0.4 FR-405：上传前用同步口令派生密钥加密 ----------
     ① 只用浏览器自带的 WebCrypto（AES-GCM + PBKDF2），不引第三方库
     ② 密钥由**同步口令**在本机派生，口令和密钥都不上云、不进日志、不进备份
     ③ 云端数据带 `__enc` 标记：没有标记 = 老版本明文，照原样读（平滑过渡）
     ④ 解密失败（口令换了 / 数据坏了）只报错，**绝不清本机、绝不自动重传** */
  /* 用户**想不想**加密（画勾选框用）；跟"实际上能不能加密"是两回事 ——
     没填口令时也想让用户把意愿先勾上，而不是点了没反应。
     下面 wantEnc 才是「实际能不能」：想加密 + 口令也填了，才真的加密。 */
  encOn(cfg){ return cfg.enc!==false; },
  wantEnc(cfg){ return cfg.enc!==false && !!cfg.pwd; },
  b64s(u8){ let s=''; new Uint8Array(u8).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); },
  unb64(s){ const bin=atob(String(s||'')); const o=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) o[i]=bin.charCodeAt(i); return o; },
  async encKey(pwd){
    const enc=new TextEncoder();
    if(!(globalThis.crypto&&crypto.subtle)) throw new Error('NOCRYPTO');
    const km=await crypto.subtle.importKey('raw',enc.encode(pwd||''),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:enc.encode(CLOUD.SALT+'.enc.v1'),iterations:CLOUD.ITER,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  },
  async wrap(payload,pwd){
    const k=await CLOUD.encKey(pwd);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(payload)));
    return {__enc:1, alg:'AES-GCM', iv:CLOUD.b64s(iv), ct:CLOUD.b64s(ct)};
  },
  async unwrap(obj,pwd){
    if(!obj || obj.__enc!==1) return obj;      /* 老版本的明文数据 → 原样返回，下次 push 自动变密文 */
    const k=await CLOUD.encKey(pwd);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:CLOUD.unb64(obj.iv)},k,CLOUD.unb64(obj.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
  url(cfg){ return String(CLOUD.sb(cfg).base||'').replace(/\/+$/,'')+'/rest/v1/todo_state'; },

  /* ---------- 腾讯云 COS：把整包数据当成**一个 JSON 文件**存 ----------
     不装 SDK，签名自己算（算法已用腾讯云官方 SDK 交叉验证，逐字节一致） */
  isCOS(cfg){ return cfg.kind==='cos'; },
  cosHost(cfg){ const c=CLOUD.cc(cfg);
    return String(c.bucket||'')+'.cos.'+(c.region||'ap-guangzhou')+'.myqcloud.com'; },
  cosPath(sid){ return '/daiban/'+encodeURIComponent(sid)+'.json'; },
  hex(buf){ return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); },
  /* 还差哪几样没填 —— 先查再发请求，别把空数据丢给加密接口（会抛看不懂的原生错误） */
  missing(cfg){
    const m=[];
    if(cfg.kind==='cos'){
      const c=CLOUD.cc(cfg);
      if(!c.bucket)   m.push('存储桶名称');
      if(!c.secretId) m.push('SecretId');
      if(!c.key)      m.push('SecretKey');
    }else{
      const c=CLOUD.sb(cfg);
      if(!c.base) m.push('服务地址');
      if(!c.key)  m.push('密钥');
    }
    if(!cfg.pwd) m.push('同步口令');
    return m;
  },
  async cosAuth(cfg, method, path){
    const c=CLOUD.cc(cfg);
    /* 空密钥拿去算 HMAC，浏览器会抛 "HMAC key data must not be empty" —— 在这里拦成人话 */
    if(!c.key || !c.secretId) throw new Error('EMPTY');
    const enc=new TextEncoder();
    const now=Math.floor(Date.now()/1000);
    const signTime=(now-300)+';'+(now+7200);        /* 前后都留富余：设备时间不准也能用 */
    const mk=async k=>crypto.subtle.importKey('raw',enc.encode(k),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const signKey=CLOUD.hex(await crypto.subtle.sign('HMAC', await mk(c.key), enc.encode(signTime)));
    const httpString=method+'\n'+path+'\n\nhost='+encodeURIComponent(CLOUD.cosHost(cfg))+'\n';
    const sts='sha1\n'+signTime+'\n'+CLOUD.hex(await crypto.subtle.digest('SHA-1',enc.encode(httpString)))+'\n';
    const sig=CLOUD.hex(await crypto.subtle.sign('HMAC', await mk(signKey), enc.encode(sts)));
    return 'q-sign-algorithm=sha1&q-ak='+encodeURIComponent(c.secretId||'')
      +'&q-sign-time='+signTime+'&q-key-time='+signTime
      +'&q-header-list=host&q-url-param-list=&q-signature='+sig;
  },
  async cosGet(cfg,sid){
    const host=CLOUD.cosHost(cfg), path=CLOUD.cosPath(sid);
    const r=await CLOUD.req('https://'+host+path,{method:'GET',
      headers:{authorization:await CLOUD.cosAuth(cfg,'get',path)}});
    if(r.status===404) return null;                        /* 还没传过 —— 正常，不是错误 */
    if(r.status===403) throw new Error('KEY');
    if(r.status>=400) throw new Error(CLOUD.cosErr(r.status));   /* COS 的错误码另有一套说法 */
    const p=r.body||{};
    return {space_id:sid, payload:(p.payload||p), updated_at:p.updatedAt||''};
  },
  async cosPut(cfg,sid,payload,at){
    const host=CLOUD.cosHost(cfg), path=CLOUD.cosPath(sid);
    /* COS 上就是一个 JSON 文件。加密包是**一个对象**，不能拆散成 todos/CATS 几个字段那样存，
       否则 iv 与密文就丢了 —— 统一放进 payload 里；读取时两种格式都认（老数据是扁平的） */
    const body=JSON.stringify({v:2, updatedAt:at, payload});
    const r=await CLOUD.req('https://'+host+path,{method:'PUT',
      headers:{authorization:await CLOUD.cosAuth(cfg,'put',path),'Content-Type':'application/json'},
      body});
    if(r.status===403) throw new Error('KEY');
    if(r.status>=400) throw new Error(CLOUD.cosErr(r.status));
    return {space_id:sid, payload, updated_at:at};
  },

  /* 最后一次真实请求的地址与状态码 —— 报错时把它显示在界面上。
     COS 是不让你填地址的（地址由「桶名 + 地域」拼出来），真出问题时不把拼出来的地址给人看，
     就只能靠猜：到底是桶名错了还是地域选错了。 */
  _url:'', _st:0,
  /* COS 的 404 / 403 跟 Supabase 完全是两回事：
     COS 不让你填地址，域名是「桶名 + 地域」拼出来的 —— 所以 404 的真实含义是
     **桶名填错 / 桶不存在 / 地域选错**，不是「少了 /rest/v1」。
     以前这里抛的是 'HTTP404'，被 why() 命中 Supabase 那条文案，于是腾讯云用户
     看到「地址不对，找不到接口」这种跟他填的东西完全无关的提示（2026-10-22 修）。 */
  cosErr(st){ return st===404 ? 'COS404' : (st===403 ? 'KEY' : ('HTTP'+st)); },

  /* 所有对外请求都过这道门：统一超时 + 统一把 fetch 的 TypeError 翻成人话 */
  async req(url,opt,ms){
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),ms||CLOUD.TIMEOUT);
    CLOUD._url=url; CLOUD._st=0;
    try{
      const r=await fetch(url,Object.assign({signal:ctl.signal},opt));
      const text=await r.text();
      CLOUD._st=r.status;
      let body=null; try{ body=text?JSON.parse(text):null; }catch(e){}
      return {status:r.status, body, text};
    } catch(e){
      const c=e && e.cause, code=(c&&c.code)||'';
      /* 域名解析不到 / 连不上 / 被墙，是三件不同的事，别全说成"不给跨域" */
      if(e && e.name==='AbortError') throw new Error('TIMEOUT');
      if(/ENOTFOUND|EAI_AGAIN/.test(code)) throw new Error('NET_DNS');
      if(/ETIMEDOUT|ECONNRESET/.test(code)) throw new Error('NET_CUT');
      if(/CERT|SSL/.test(code)) throw new Error('NET_CERT');
      throw new Error('CORS');
    } finally{ clearTimeout(tm); }
  },
  /* getRow / putRow 是唯一对外接口 —— 加密在这一层统一做，SYNC 与界面都不用改 */
  async getRow(cfg,sid){
    const row = CLOUD.isCOS(cfg) ? await CLOUD.cosGet(cfg,sid) : await CLOUD.sbGet(cfg,sid);
    if(!row || !CLOUD.wantEnc(cfg)) return row;
    try{
      const p = await CLOUD.unwrap(row.payload, cfg.pwd);
      return Object.assign({}, row, {payload:p});
    }catch(e){
      if(e && e.message==='NOCRYPTO') return row;      /* 环境不支持就不折腾，照常明文用 */
      throw new Error('ENC');                           /* 口令不对 / 数据坏 —— 不做猜测，交给 UI 说清楚 */
    }
  },
  async sbGet(cfg,sid){
    const u=CLOUD.url(cfg)+'?space_id=eq.'+encodeURIComponent(sid)+'&select=space_id,payload,updated_at';
    let r;
    try{ r=await CLOUD.req(u,{method:'GET',headers:CLOUD.hdr(cfg)}); }
    catch(e){ throw e; }
    if(r.status===401||r.status===403) throw new Error('KEY');
    if(r.status===404){
      const m=String((r.body&&r.body.message)||'').toLowerCase();
      throw new Error(m.indexOf('does not exist')>=0 ? 'TABLE' : 'HTTP404');
    }
    if(r.status>=400) throw new Error('HTTP'+r.status);
    return Array.isArray(r.body)&&r.body[0] ? r.body[0] : null;
  },
  async putRow(cfg,sid,payload,at){
    let p=payload, res;
    if(CLOUD.wantEnc(cfg)){
      try{ p=await CLOUD.wrap(payload,cfg.pwd); }
      catch(e){ /* 环境不支持加解密 → 退回明文，同步照样能用（规则 13：不阻塞） */ }
    }
    res = CLOUD.isCOS(cfg) ? await CLOUD.cosPut(cfg,sid,p,at) : await CLOUD.sbPut(cfg,sid,p,at);
    /* 对外交代的仍是本机这份明文 —— 密文只在传输那一瞬间存在 */
    return Object.assign({}, res, {payload});
  },
  async sbPut(cfg,sid,payload,at){
    const row={space_id:sid,payload,updated_at:at,device_id:DEVID,app_ver:APPVER};
    let r;
    try{
      r=await CLOUD.req(CLOUD.url(cfg),{method:'POST',
        headers:Object.assign({},CLOUD.hdr(cfg),{Prefer:'resolution=merge-duplicates,return=representation'}),
        body:JSON.stringify([row])});
    } catch(e){ throw e; }
    if(r.status===401||r.status===403) throw new Error('KEY');
    if(r.status===409) throw new Error('CONFLICT');
    if(r.status>=400) throw new Error('HTTP'+r.status);
    return (Array.isArray(r.body)&&r.body[0])||row;
  },
  /* 连接测试必须来自**一次真实读写**，不 ping、不只看 HTTP 200 */
  async test(cfg){
    const miss=CLOUD.missing(cfg);
    if(miss.length) return {ok:false, code:'EMPTY', msg:'还差：'+miss.join('、')};
    try{ await CLOUD.getRow(cfg,'__probe__'+CLOUD.hash32(String(Date.now())));
         return {ok:true, msg:'连接成功 · 地址通、也能读写', at:CLOUD.at(cfg)}; }
    catch(e){ return {ok:false, code:e.message, msg:CLOUD.why(e.message),
                      at:CLOUD.at(cfg), http:CLOUD._st||0}; }
  },
  why(c){ return ({
    CORS:'请求根本没发出去 —— 多半是这个后端不给跨域许可（要返回 Access-Control-Allow-Origin: *），也可能是地址填错了',
    TIMEOUT:'等太久没回应 —— 网络不通，或者地址填错了',
    KEY:'密钥不对，或者这个密钥没有这张表的权限',
    TABLE:'地址是通的，但**表还没建** —— 去后端跑一下建表脚本（本页底部有）',
    CONFLICT:'两边都改过，得先选一边',
    HTTP404:'地址不对，找不到接口 —— 服务地址要填到 <code>/rest/v1</code> 那一层（Supabase 后台 → Project Settings → Data API）',
    COS404:'桶里没有这个文件 / 找不到桶 —— 腾讯云 COS <b>不用填地址</b>，地址是「桶名 + 地域」拼出来的。'
          +'先核对这两样：① 桶名要<b>连后面那串数字一起</b>（例 <code>todo-1250000000</code>）② 地域选的是不是这个桶所在的地域',
    COS403:'签名没通过 —— 密钥不对，或者这个子账号没有这个桶的权限',
    KEYCHAR:'密钥里有中文或全角符号 —— HTTP 头放不下它。重新粘贴一遍，注意别带上空格',
    EMPTY:'还有必填的没填 —— 填完再测',
    NET_DNS:'域名解析不到 —— 检查存储桶名（要带后面那串数字）和地域选对了没',
    NET_CUT:'连到一半断了 —— 网络不通，或这个服务在你这边访问受阻',
    NET_CERT:'证书校验没过 —— 检查系统时间是不是准的',
    ENC:'云端的数据解不开 —— 通常是<b>同步口令跟上次不一样</b>了（口令换了 = 换了一个空间），也可能是云端那份是旧版存的明文。<br><br>本机数据<b>一点没动</b>，也没往上传。要接着用：把口令改回原来那个，或者在「数据与备份」里把本机这份导出留个底，再重新配一次。'
  })[c] || ('后端返回：'+(c||'未知错误')); }
};

const SYNC={
  CK:'todo.sync.v1',
  /* kind='supabase'：填 服务地址 + 密钥
     kind='cos'     ：填 存储桶 + 地域 + SecretId + SecretKey（腾讯云对象存储）
     ⚠️ 两家是**两套独立的格子**：切服务商不会把上家的密钥带过来 */
  cfg:{on:false, kind:'supabase', pwd:'', space:'', at:'', fp:'', enc:true,   /* V0.4：云端加密，默认开 */
       supabase:{base:'', key:''},
       cos:{bucket:'', region:'ap-guangzhou', secretId:'', key:''}},
  busy:false, applying:false, _t:null, hold:false,
  st:{state:'off', msg:'还没开 · 现在只在本地记录', last:'', err:''},

  load(){ try{
      const s=localStorage.getItem(SYNC.CK);
      if(!s) return;
      const o=JSON.parse(s);
      SYNC.cfg.on=!!o.on; SYNC.cfg.kind=o.kind||'supabase';
      SYNC.cfg.pwd=deobf(o.pwd||'');                   /* 口令也混淆存，跟 AI Key 一个待遇 */
      SYNC.cfg.space=o.space||''; SYNC.cfg.at=o.at||''; SYNC.cfg.fp=o.fp||'';
      /* 两家各自的格子；老版本是扁平存的，顺手搬过来，不让已填的东西丢 */
      SYNC.cfg.supabase=Object.assign({base:'',key:''}, o.supabase||{});
      SYNC.cfg.cos=Object.assign({bucket:'',region:'ap-guangzhou',secretId:'',key:''}, o.cos||{});
      if(!SYNC.cfg.supabase.base && o.base) SYNC.cfg.supabase.base=o.base;
      if(!SYNC.cfg.supabase.key  && o.key)  SYNC.cfg.supabase.key=o.key;
      if(!SYNC.cfg.cos.bucket    && o.bucket)   SYNC.cfg.cos.bucket=o.bucket;
      if(!SYNC.cfg.cos.region    && o.region)   SYNC.cfg.cos.region=o.region;
      if(!SYNC.cfg.cos.secretId  && o.secretId) SYNC.cfg.cos.secretId=o.secretId;
      SYNC.cfg.supabase.key=deobf(SYNC.cfg.supabase.key||'');
      SYNC.cfg.cos.key=deobf(SYNC.cfg.cos.key||'');
      SYNC.cfg.cos.secretId=deobf(SYNC.cfg.cos.secretId||'');
      SYNC.cfg.enc = (o.enc!==false);            /* V0.4 FR-405：云端加密默认开 */
    }catch(e){} },
  save(){ try{ const c=SYNC.cfg;
      localStorage.setItem(SYNC.CK, JSON.stringify({
        on:c.on, kind:c.kind, pwd:obf(c.pwd||''), space:c.space, at:c.at, fp:c.fp, enc:(c.enc!==false),
        supabase:{base:c.supabase.base, key:obf(c.supabase.key||'')},
        cos:{bucket:c.cos.bucket, region:c.cos.region,
             secretId:obf(c.cos.secretId||''), key:obf(c.cos.key||'')}
      }));
    }catch(e){} },
  /* 两种后端要填的东西不一样，缺一样都不开工（各查各的格子） */
  filled(){ const c=SYNC.cfg;
    return c.kind==='cos'
      ? !!(c.cos.bucket && c.cos.region && c.cos.secretId && c.cos.key && c.pwd)
      : !!(c.supabase.base && c.supabase.key && c.pwd); },
  ready(){ const c=SYNC.cfg; return !!(c.on && SYNC.filled()); },
  online(){ try{ return navigator.onLine!==false; }catch(e){ return true; } },

  /* 本机数据指纹：跟上次同步时不一样，就说明本机改过 */
  fp(){ try{ const s=JSON.stringify({todos,CATS,CAT_STYLE,reviews});
      return s.length+'.'+CLOUD.hash32(s); }catch(e){ return '0'; } },
  async sid(){ const c=SYNC.cfg; if(!c.pwd) return '';
    if(c.space) return c.space;
    const s=await CLOUD.sid(c.pwd); c.space=s; SYNC.save(); return s; },

  say(state,msg,err){ SYNC.st={state,msg:msg||'',last:SYNC.st.last,err:err||''}; },

  /* ---- 一次完整同步：拉 → 必要时空役合并 → 推 ---- */
  async run(opt){
    opt=opt||{};
    if(!SYNC.ready()){ if(SYNC.cfg.on) SYNC.say('bad','配置不完整 · 还差一两样'); return {ok:false,reason:'off'}; }
    if(SYNC.busy){ return {ok:false,reason:'busy'}; }
    if(!SYNC.online()){ SYNC.say('wait','断网中 · 改动都在本机，联网后自动补传'); return {ok:false,reason:'offline'}; }
    SYNC.busy=true;
    try{
      const cfg=SYNC.cfg, sid=await SYNC.sid();
      const remote=await CLOUD.getRow(cfg,sid);
      const changed = SYNC.fp()!==cfg.fp;
      const remoteNew = remote && String(remote.updated_at||'') > String(cfg.at||'');
      let how='noop';

      if(remoteNew && changed){
        /* 两边都动过 → 只有手动触发时才当场问，自动同步一律乖乖等你来裁决，绝不偷偷覆盖 */
        const pick = opt.prefer || (opt.manual ? await SYNC.ask(remote) : null);
        if(!pick){ SYNC._pending={remote}; SYNC.say('conflict','两边都改过 · 点这里选以哪边为准'); return {ok:false,reason:'conflict'}; }
        if(pick==='cloud'){ SYNC.pull(remote); how='pulled'; } else how='pushed';
      } else if(remoteNew){ SYNC.pull(remote); how='pulled'; }
      else if(changed || !remote){ how='pushed'; }

      if(how==='pushed'){
        const now=new Date().toISOString();
        await CLOUD.putRow(cfg,sid,{v:2,todos,CATS,CAT_STYLE,reviews},now);
        cfg.at=now; cfg.fp=SYNC.fp(); SYNC.save();
      }
      SYNC._pending=null;
      SYNC.say('ok', (how==='pulled'?'已从云端拉下来 · ':(how==='pushed'?'已推上去 · ':'两边一样 · '))+'上次同步 '+nowHM());
      SYNC.st.last=nowStamp();
      if(how!=='noop') BAK.snapshot();            /* FR-307：每次成功同步顺手写份本机快照 */
      return {ok:true, how};
    }catch(e){
      const code=(e&&e.message)||'ERR';
      SYNC.say('err', CLOUD.why(code), code);
      return {ok:false, reason:code};
    }finally{ SYNC.busy=false; }
  },

  /* 把云端那份落到本机：走的是「合并」口径（同一个 id 以最后修改更晚的为准） */
  pull(remote){
    const d=(remote&&remote.payload)||{};
    SYNC.applying=true;
    try{ mergeImport({todos:d.todos||[], CATS:d.CATS, CAT_STYLE:d.CAT_STYLE, reviews:d.reviews}); }
    finally{ SYNC.applying=false; }
    SYNC.cfg.at=String(remote.updated_at||'');
    SYNC.cfg.fp=SYNC.fp(); SYNC.save();
  },
  ask(remote){
    return new Promise(res=>{
      modalOptions('两台设备都改过',[
        ['local','以本机为准 · 把这台的数据推上去'],
        ['cloud','以云端为准 · 拉下来覆盖本机']
      ], v=>res(v));
    });
  },

  /* 自动同步：改动后攒一下再发，别每敲一个字都联网。云端落地导致的变化不回环 */
  schedule(){
    if(!SYNC.ready()||SYNC.applying||SYNC.hold) return;
    clearTimeout(SYNC._t);
    SYNC._t=setTimeout(()=>{ SYNC.run(); },1200);
  },

  /* ---- 配置码：给另一台设备用（含密钥+口令，等于钥匙）---- */
  code(){ const c=SYNC.cfg;
    return 'DBSYNC1:'+btoa(unescape(encodeURIComponent(
      JSON.stringify({kind:c.kind, pwd:c.pwd, supabase:c.supabase, cos:c.cos})))); },
  applyCode(text){
    const s=String(text||'').trim();
    if(s.indexOf('DBSYNC1:')!==0) throw new Error('不是本应用的配置码');
    const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(8)))));
    if(!o.pwd) throw new Error('配置码不完整');
    SYNC.cfg.kind=o.kind||'supabase';
    SYNC.cfg.pwd=o.pwd; SYNC.cfg.space='';
    /* 只覆盖这一家的格子，另一家保持原样 */
    if(o.supabase) SYNC.cfg.supabase=Object.assign({base:'',key:''}, o.supabase);
    if(o.cos)      SYNC.cfg.cos=Object.assign({bucket:'',region:'ap-guangzhou',secretId:'',key:''}, o.cos);
    SYNC.cfg.on=false; SYNC.save();
    return true;
  },
  /* 断开 = 把**当前这家**的密钥抹掉；另一家的留着，回头切回去不用重填 */
  clear(){ const kind=SYNC.cfg.kind||'supabase';
    SYNC._t&&clearTimeout(SYNC._t);
    SYNC.cfg={on:false, kind, pwd:'', space:'', at:'', fp:'', enc:true,
      supabase:{base:'', key:''}, cos:{bucket:'', region:'ap-guangzhou', secretId:'', key:''}};
    SYNC.save();
    SYNC.say('off','未开启 · 本机数据没动'); }
};

   防不住懂技术的人在本机翻。真正的保护是：**永远不要把它写进代码、不要提交网盘**。
   ================================================================== */

/* 混淆：只在 base64 字符表内部平移 + 错位，保证结果可读不出原文、又不会变成乱码 */
const AB64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
function obf(s){
  if(!s) return '';
  let b; try{ b=btoa(unescape(encodeURIComponent(s))); }catch(e){ return ''; }
  return b.split('').map(c=>{const i=AB64.indexOf(c); return i<0?c:AB64[(i+29)%AB64.length];}).join('');
}
function deobf(s){
  if(!s) return '';
  if(!/^[A-Za-z0-9+/=]+$/.test(s)) return s;            /* 历史明文数据，直接沿用 */
  const r=s.split('').map(c=>{const i=AB64.indexOf(c); return i<0?c:AB64[(i-29+AB64.length*2)%AB64.length];}).join('');
  try{ return decodeURIComponent(escape(atob(r))); }catch(e){ return ''; }
}

    }catch(e){} },

/* 给新条目发号 —— **不再用单纯的 ++uid**（2026-10-21 发版审查修）。
   老办法的坑：两台设备（手机 + 电脑）从同一份数据出发各自新建时，
   由于各自的号都从本机的 max(id) 继续往后加，会发出**完全一样的 id**；
   再同步时被当成同一条、按 updatedAt 互相覆盖 —— 另一台新建的那条就凭空没了。
   现在改用「毫秒时间戳」：跨设备撞号的概率几乎为零，跟老数据里 1xx 这种号也不会打架。
   同一毫秒里连开多条（比如批量解析）时往后顺延，保证本机内部也绝不重复。 */
let _lastId = 0;
function newId(){
  /* 毫秒数再乘 1000 留出三位尾号的空间，尾号随机 —— 这样两台设备即使恰好在同一毫秒
     新建条目，撞号的概率也只有千分之一；同一台设备同毫秒连开多条则由下面的循环兜住。 */
  let id = Date.now()*1000 + Math.floor(Math.random()*1000);
  /* ① 必须比本机已经发出过的号大（严格递增）② 必须不跟库里任何一条撞
     —— 导入 / 云端拉回来的数据可能带着比现在更新的时间戳 */
  let guard = 0;
  while((id <= _lastId || todos.some(t=>t.id===id)) && guard++ < 10000) id++;
  _lastId = id;
  return id;
}

function hexRGB(h){
  let x=String(h||'').replace('#','');
  if(x.length===3) x=x.split('').map(c=>c+c).join('');
  const n=parseInt(x||'000000',16);
  return isNaN(n)?{r:0,g:0,b:0}:{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function mixHex(a,b,w){
  const A=hexRGB(a),B=hexRGB(b);
  const h=v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0');
  return '#'+h(A.r+(B.r-A.r)*w)+h(A.g+(B.g-A.g)*w)+h(A.b+(B.b-A.b)*w);
}
/* 相对亮度：给状态栏图标深浅用（FR-403） */
function themeLum(hex){ const c=hexRGB(hex); return (0.299*c.r+0.587*c.g+0.114*c.b)/255; }
/* 自选主色 → 自动配出整套（品牌深浅 / 淡底 / 深字），保证文字始终读得清 */
function themeFromHex(hex){ return {
  brand:hex, brand2:mixHex(hex,'#FFFFFF',0.30), brandink:mixHex(hex,'#000000',0.22),
  soft:mixHex(hex,'#FFFFFF',0.86), bg:mixHex(hex,'#FFFFFF',0.955),
};}
function themeOf(dm){
  const c=THEME_CFG[dm]||{k:DEF_THEME[dm]};
  if(c.custom&&c.brand) return themeFromHex(c.brand);
  return THEMES.find(x=>x.k===c.k)||THEMES.find(x=>x.k===DEF_THEME[dm])||THEMES[0];
}

  const p=themeOf(dm);

/* 「标题为空 → 拿备注前 12 字顶上」的**唯一入口**（2026-10-21 统一出来的）。

const titleOf = t => String((t&&t.title)||'').trim() || String((t&&t.remark)||'').slice(0,12);

function fmtSub(t){
  /* 收件箱里还没解析的：提示去补字段 */
  if(t.inbox && !t.title) return '未解析 · 点进去补充字段';
  /* 已完成：显示真实完成时刻，而不是原定时间
     （slice(5,10) 只取「月-日」—— 之前写成 slice(5) 会把时刻也吞进去，显示成「10月21 20:24日 20:24」） */
  if(t.done && t.doneAt)
    return '完成于 '+t.doneAt.slice(5,10).replace('-','月')+'日 '+t.doneAt.slice(11,16)+(t.cat?' · '+t.cat:'');
  const p=[];
  if(overdue(t)) p.push('逾期 '+daysLate(t)+' 天');
  else if(t.due===TODAY && t.time) p.push(t.time);
  else if(t.due) p.push(t.due.slice(5).replace('-','月')+'日');
  if(t.cat) p.push(t.cat);
  return p.join(' · ')||'无时间 · 未归类';
}

/* 排序（2026-10-21 改口径）：置顶 > **逾期组**（组内只按轻重缓急，不看逾期了几天）
   > 其余**按时间先后**（先日期、再当天具体时刻）> 同一时间再按轻重缓急 > 已完成沉底。
   首页列表 / 日历当天明细 / 筛选结果 / 收件箱共用一个函数，口径永远一致。 */
function sortList(arr){
  const q=t=>(t.imp&&t.urg?0:(t.imp?1:(t.urg?2:3)));              /* 轻重缓急：马上做 ①②③④ */
  /* 时间先后 = 日期 + 具体时刻；没填日期的自然排在最后（用 9999 兜底） */
  const tk=t=>String(t.due||'9999-99-99')+' '+(t.time||'99:99');
  return [...arr].sort((a,b)=>{
    if(a.pinned!==b.pinned) return a.pinned?-1:1;   // ① 置顶最优先（哪怕它已完成）
    if(a.done!==b.done) return a.done?1:-1;         // ⑤ 已完成沉到最下方，但仍显示
    const ao=overdue(a), bo=overdue(b);
    if(ao!==bo) return ao?-1:1;                     // ② 逾期组整体提前
    if(ao) return q(a)-q(b);                        // ③ 多条逾期之间只看轻重缓急
    const tk2=tk(a).localeCompare(tk(b));           // ④ 其余按时间先后排
    if(tk2) return tk2;
    return q(a)-q(b);                               // 同一时间 → 再按轻重缓急
  });
}
/* 某天的完成 / 未完成统计（日历格实时读它，随勾选变化）—— M1 按真实日期 key */
function dayStat(key){
  const l=todos.filter(t=>!t.deleted&&!t.inbox&&t.domain===S.domain&&t.due===key);
  return {done:l.filter(t=>t.done).length, undone:l.filter(t=>!t.done).length, total:l.length};
}
/* 这天是否有"原定在这天、但还没做"的事（红下划线） */
function dayOverdue(key){
  return key<TODAY && todos.some(t=>!t.deleted&&!t.inbox&&t.domain===S.domain&&t.due===key&&!t.done);
}

/* ============ 搜索与筛选 FR-406（V0.4）============
   ① 只做过滤，**不改排序**（规则 1），纯内存算，不落库
   ② 搜标题 + 备注（备注是原话，很多条目就靠它找回来）；标题命中的排前面
   ③ 清空一步还原，Esc 也行 */
/* 三个过滤函数都接受一个「条件包 f」，不传就用首页那套（S.q/…）。
   日历页的筛选是**另一套独立条件**（calF()），互不干扰 —— 首页开着搜索切到日历页，
   日历页也不会跟着筛（用户明确要求两屏断开）。 */
function hasFilter(f){ f=f||{q:S.q,fq:S.fq,fcat:S.fcat,fst:S.fst}; return !!(f.q||f.fq||f.fcat||f.fst); }
/* 筛选小药丸的统一长相（首页与日历弹窗**共用**，保证两屏一致）：
   选中 = 该颜色实底 + 白字；未选中 = 白底 + 该颜色的字和边。
   细描边在手机上根本看不清，所以改成"底色翻转"这种一眼能分辨的对比 */
function chipStyle(on,color){
  const c=color||'var(--brand)';
  return `background:${on?c:'#fff'};color:${on?'#fff':c};border:1.5px solid ${c}`;
}
function matchFilter(t,f){
  f=f||{q:S.q,fq:S.fq,fcat:S.fcat,fst:S.fst};
  if(f.fq && quadKey(t.imp,t.urg)!==f.fq) return false;
  if(f.fcat && (t.cat||'')!==f.fcat) return false;
  if(f.fst==='undone'   &&  t.done)  return false;
  if(f.fst==='done'     && !t.done)  return false;
  if(f.fst==='overdue'  && !overdue(t)) return false;
  const q=(f.q||'').trim().toLowerCase();
  if(!q) return true;
  return (String(t.title||'').toLowerCase().indexOf(q)>=0)
      || (String(t.remark||'').toLowerCase().indexOf(q)>=0);
}
function applyFilter(list,f){
  const r=sortList(list.filter(t=>matchFilter(t,f)));
  const q=((f&&f.q)||(f==null?S.q:'')||'').trim().toLowerCase();
  if(!q) return r;
  /* 标题命中排前面（Array.sort 稳定，组内顺序不变） */
  const hit=t=>String(t.title||'').toLowerCase().indexOf(q)>=0?0:1;
  return [...r].sort((a,b)=>hit(a)-hit(b));
}
function clearFilter(){ S.q=''; S.fq=''; S.fcat=''; S.fst=''; }
/* 只重画列表那一块 —— 输入框不重建，光标和焦点都不丢 */
function refreshNoteList(){
  const w=document.getElementById('listwrap');
  if(w) w.innerHTML=noteListHTML();
  const c=document.getElementById('qcount');

}
/* ============ 日历页的筛选（FR-406 第二屏版本 · 弹窗形态）============
   ① 入口是**一个按钮**，点开才是弹窗 —— 不跟月历抢首屏空间
   ② 条件是**独立的**（calQ/calFq/calFcat/calFst），跟首页搜索彻底断开
   ③ 范围：本月 = 当前翻到的那个月；全部 = 这个域所有条目（含没定日期的）
   ④ 结果列在弹窗下方，点条目照样进详情 */
function calF(){ return {q:S.calQ, fq:S.calFq, fcat:S.calFcat, fst:S.calFst}; }
function calPool(){
  let pool = todos.filter(t=>!t.inbox && !t.deleted && t.domain===S.domain);
  if(S.calScope!=='all'){
    const ym=S.calY+'-'+String(S.calM+1).padStart(2,'0');
    pool = pool.filter(t=>String(t.due||'').slice(0,7)===ym);
  }
  return pool;
}
function calResultHTML(){
  const f=calF();
  if(!hasFilter(f)) return '<div class="emptybox">先输入关键词，或点下面的条件筛一下</div>';
  const list=applyFilter(calPool(),f);
  const scope=(S.calScope==='all') ? '全部' : (S.calM+1)+' 月';
  if(!list.length)
    return '<div class="emptybox">这个范围内没有匹配的 · 换个词，或把范围切成「全部」</div>';
  return `<div class="grouptitle" style="margin-top:8px">${scope} · 匹配 ${list.length} 条</div>`
    + list.map(itemHTML).join('');
}

   点条件 → 只重画条件区（选中态立刻变）；打字 → 只重画结果区（不丢焦点）。 */

/* 首页池子 = 逾期 + 今天（跟 noteListHTML 取的是同一批），收起态的「筛选中 · N 条」用它算数 */

      <span style="flex:1;text-align:left;font-size:13px;color:${on?'var(--brand)':'var(--ink3)'}">${on?`筛选中 · ${n} 条`:'搜标题 / 备注 · 按象限、分类、状态筛'}</span>

/* ============ 在线更新 FR-401（V0.4 · 版本源 = GitHub Releases）============
   ① 更新源地址写死在 REPO 里；凡是查不到版本的情况（404 / 断网 / 超时）一律**静默**（规则 13）
   ② APK 资源走原生下载 + 系统安装向导；网页版没有版本概念，只给一句说明
   ③ 下载链接只认 GitHub 自家域名，防止哪天仓库被换成别的东西 */
const UPD={
  REPO:'AzazelKumaki/todonotes',
  API:'https://api.github.com/repos/AzazelKumaki/todonotes/releases/latest',
  PAGE:'https://github.com/AzazelKumaki/todonotes/releases/latest',
  KEY:'todo.upd.v1',
  st:{latest:'', notes:'', apk:'', checkedAt:'', today:''},
  load(){ try{ Object.assign(UPD.st, JSON.parse(localStorage.getItem(UPD.KEY)||'{}')||{}); }catch(e){} },
  save(){ try{ localStorage.setItem(UPD.KEY, JSON.stringify(UPD.st)); }catch(e){} },
  ver(s){ const m=String(s||'').match(/(\d+)\.(\d+)/); return m?(m[1]+'.'+m[2]):''; },
  cur(){
    let v='';
    try{ if(typeof AppBridge!=='undefined' && AppBridge.getVersionName) v=AppBridge.getVersionName(); }catch(e){}
    return UPD.ver(v)||UPD.ver(APPVER);
  },
  cmp(a,b){
    const A=String(a||'').split('.').map(Number), B=String(b||'').split('.').map(Number);
    for(let i=0;i<2;i++){ const d=(A[i]||0)-(B[i]||0); if(d) return d; }
    return 0;
  },
  okUrl(u){ return /^https:\/\/(github\.com|objects\.githubusercontent\.com|release\.github\.com)\//i.test(String(u||'')); },
  isApp(){ let a=false; try{ a=!!(typeof AppBridge!=='undefined'&&AppBridge.isApp&&AppBridge.isApp()); }catch(e){} return a; },
  async check(){
    UPD.load();
    try{
      const r=await withTimeout(fetch(UPD.API,{headers:{'Accept':'application/vnd.github+json'}}),5000,'请求超时');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      const tag=UPD.ver(String(j.tag_name||'').replace(/^[vV]/,''));
      const asset=(j.assets||[]).find(a=>/\.apk$/i.test(a.name||''));
      UPD.st.latest=tag;
      UPD.st.notes=String(j.body||'').trim();
      UPD.st.apk=(asset&&UPD.okUrl(asset.browser_download_url))?asset.browser_download_url:'';
      UPD.st.checkedAt=nowStamp(); UPD.save();
      if(!tag) return 'none';
      return UPD.cmp(tag,UPD.cur())>0 ? 'new' : 'latest';
    }catch(e){
      UPD.st.checkedAt=nowStamp(); UPD.save();
      UPD.st.err=String(e&&e.message||e);
      return 'none';       /* 没 VERSION.json / 404 / 断网 —— 一律静默，不打扰 */
    }
  },
  /* 把下载交给原生：APK 是二进制，塞不进 WebView 的字符串通道（会坏包） */
  install(){
    if(!UPD.isApp()){ locationVerbose(); return; }
    if(!UPD.okUrl(UPD.st.apk)){ modal('下载不了','这个版本的安装包地址不在允许的域名里，去发布页手动下载吧。'); return; }
    let ok=false;
    try{ if(typeof AppBridge!=='undefined'&&AppBridge.installApk){ AppBridge.installApk(UPD.st.apk); ok=true; } }catch(e){}
    if(!ok) modal('手机端才能安装','电脑上打开的是网页版，直接到发布页下载 APK 拷到手机里装就行。');
  },
  openPage(){
    try{ if(UPD.isApp() && typeof AppBridge!=='undefined' && AppBridge.openUrl){ AppBridge.openUrl(UPD.PAGE); return; } }catch(e){}
    try{ window.open(UPD.PAGE,'_blank'); }catch(e){}
  }
};
function locationVerbose(){ modal('网页版没有版本概念','网页就是 `index.html` 本身 —— 换新版只要拿新的这个文件覆盖旧的就行，不存在"下载安装"。' ); }


/* ============ 渲染入口 ============ */
/* 上一次渲染时「页面是谁」——用来判断该不该保住滚动位置。
   之前只靠调用方传 keep，很多地方没传，于是点一下任何选项都被弹回顶部（V0.2 修） */
let _lastPosKey='';
let _lastMain=null;   /* 上一次渲染的「页面坐标」—— 用来判断页面切换方向（动效用） */
function posKey(){
  return [S.tab, S.sub||'', S.detailId||'', S.day||'', S.inboxFrom||''].join('|');
}
function render(keep){
  DB.save();   /* M1：任何一次改动都先落盘，关掉再打开还在 */
  // 先记住滚动位置：勾一条完成后不该把页面弹回顶部
  const _v0=document.getElementById('view');
  const _top=_v0?_v0.scrollTop:0;
  const _key=posKey();
  const _same=(_key===_lastPosKey);
  /* 药丸换色要用到的「旧品牌色」：**必须在换主题之前读**，body class 一换 --brand 就变了。
     （getComputedStyle 在测试 stub 里没有，所以整个包在 try 里） */
  try{ _prevBrand=(getComputedStyle(document.body).getPropertyValue('--brand')||'').trim(); }catch(e){}
  // 第③栏「我的」= 中性主题（设置与域无关）；收件箱沿用进入时的域
  // ⚠️ 只换主题类，不能整体覆盖 className —— 否则会把启动时认领的 app-mode（APK 真机全屏）冲掉
  document.body.classList.remove('theme-work','theme-life','theme-neutral');
  document.body.classList.add('theme-' + (S.tab==='me' ? 'neutral'
    : (S.sub==='inbox' ? S.inboxFrom : S.domain)));
  /* 配色（FR-402）：第③栏保持中性灰，其余按当前域（收件箱沿用进入时的域）套用用户选的配色 */
  if(S.tab==='me') clearThemeVars();
  else applyTheme(S.sub==='inbox' ? S.inboxFrom : S.domain);
  try{ _curBrand=(getComputedStyle(document.body).getPropertyValue('--brand')||'').trim(); }catch(e){}
  const v=document.getElementById('view'), tb=document.getElementById('tabbar');
  document.getElementById('phone').querySelectorAll('.fab').forEach(e=>e.remove());

  const isSub = !!S.sub;
  tb.style.display = isSub ? 'none' : 'flex';
  tb.innerHTML = isSub ? '' : tabbarHTML();
  /* 域切换器 = 顶部固定栏（不随页面滚动消失）。「我的」页是灰色静态态（设置与域无关）；
     二级页（详情 / 收件箱 / 设置项）没有切换器，跟旧版一致 */
  const db=document.getElementById('domainbar');
  if(db){
    if(isSub){ db.style.display='none'; db.innerHTML=''; }
    else{
      db.style.display='block';
      db.innerHTML = S.tab==='me' ? switchNeutralHTML() : switchHTML();
    }
  }
  v.innerHTML = isSub ? subHTML() : mainHTML();
  /* 页面切换进场动画（衔接动效 ②）：只看「页面坐标」变没变 —— tab / 二级页 / 域 / 聚焦。
     勾选完成这类原地更新坐标没变，不播整屏动画（只播条目自己的 fx）。 */
  const _main={tab:S.tab,sub:S.sub||'',detailId:S.detailId||'',day:S.day||'',
    domain:S.domain,inboxFrom:S.inboxFrom||'',focused:!!S.focused};
  if(_lastMain){
    let _dir=null;
    if(_main.sub!==_lastMain.sub || _main.detailId!==_lastMain.detailId || _main.day!==_lastMain.day){
      _dir = (_main.sub && !_lastMain.sub) ? 'pagein-f'          /* 进二级页：从右滑入 */
           : (!_main.sub && _lastMain.sub) ? 'pagein-b'          /* 返回：从左滑入 */
           : 'pagein-u';                                          /* 二级页之间跳：上浮 */
    }else if(_main.tab!==_lastMain.tab || _main.domain!==_lastMain.domain){
      _dir='pagein-u';                                            /* 切 tab / 切域：上浮 */
    }else if(_lastMain.focused && !_main.focused){
      _dir='pagein-u';                                            /* 退出聚焦：轻浮一下，柔化面板收起 */
    } /* 进入聚焦不播整屏动画 —— 交给面板自己的展开动画 */
    if(_dir){
      v.classList.remove('pagein-f','pagein-b','pagein-u');
      void v.offsetWidth;              /* 强制回流：同一帧内先摘再戴，动画才会重播 */
      v.classList.add(_dir);
    }
  }
  _lastMain=_main;
  if(!isSub) fabHTML();
  /* 同一个页面内原地更新 → 保住滚动位置；换了页面（切 tab / 进出二级页 / 换条目）→ 回到顶部。
     显式传 keep=false 才会强制回顶（比如"新建分类"这类希望看到顶部的操作） */
  v.scrollTop = (keep===false) ? 0 : (_same ? _top : 0);
  _lastPosKey=_key;
  // PRD 硬规则：打开即落在「记一笔」且输入框自动聚焦（= 直接进入 A2 输入态）
  // ⚠️ focus() 会把输入框滚进可视区 —— 而输入框就在页面顶部，于是「勾一条完成」也被拽回顶部。
  //    所以：① 已经聚焦了就别再聚焦 ② 加 preventScroll，只拿光标不动页面（V0.2 修）
  if(!isSub && S.tab==='note' && S.focused){
    const el=document.getElementById('qi');
    if(el && document.activeElement!==el){
      try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} }
      try{const n=el.value.length; el.setSelectionRange(n,n);}catch(e){}
    }
  }
  /* 动效标记只服务「这一次」渲染：class 已写进刚替换的 HTML 里，动画会自己播完 */
  S._fx=null; S._panelIn=false;
  /* V0.3：任何一次界面刷新都意味着数据可能变了 —— 攒 1.2 秒后自动同步一次。
     云端落地引发的 render 不会来回触发（SYNC.applying 期间跳过） */
  try{ SYNC.schedule(); }catch(e){}
}

/* 底部三 Tab：选中态是一块**会滑过去的药丸**（.pill），不是各自瞬间换底色。
   render() 会整个重建底栏，所以不能靠 transition —— 得把「上一格是第几个」写进 --f，
   用 animation 从旧位置滑到新位置（跟页面切换同一套路：只做「进」）。 */
let _lastTabIdx=null;
let _prevBrand='', _curBrand='';   /* 切换前后的品牌色：药丸换色动画的起点 / 终点 */
/* 一块药丸 = 移动（mv，--f 旧格 → --i 新格）+ 换色（--fc 旧色 → --brand 新色）。
   没移动但颜色变了（比如切域时底栏 Tab 的药丸原地换色）就只播换色（tint）。 */
function pillHTML(cls,idx,last){
  const from=(last!=null&&last!==idx)?last:null;
  const tint=(from==null&&_prevBrand&&_curBrand&&_prevBrand!==_curBrand);
  const fc=_prevBrand?`;--fc:${_prevBrand}`:'';
  return `<span class="pill ${cls} ${from!=null?'mv':''}${tint?' tint':''}" style="--i:${idx}${from!=null?';--f:'+from:''}${fc}"></span>`;
}
function tabbarHTML(){
  const idx=S.tab==='note'?0:(S.tab==='calendar'?1:2);
  const t=(id,label,icon)=>`<button class="tab ${S.tab===id?'on':''}" data-act="tab" data-v="${id}">${icon}<span>${label}</span></button>`;
  const pill=pillHTML('pill-tab',idx,_lastTabIdx);
  _lastTabIdx=idx;
  return `<div class="tabcapsule">
    ${pill}
    ${t('note','记一笔','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>')}
    ${t('calendar','日历','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>')}
    ${t('me','我的','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>')}

}

  if(!S._recurFocused){

function genRecur(){
  syncRecur();
  const r=S._recur; if(!r || !r.title.trim()){ toast('先给它起个名字'); return; }
  const base=new Date(TODAY+'T00:00:00'); let dates=[];
  if(r.mode==='week'){
    const cur=base.getDay()||7; let diff=(r.wd-cur+7)%7; if(diff===0) diff=7;
    for(let i=0;i<3;i++){ const x=new Date(base); x.setDate(x.getDate()+diff+i*7); dates.push(fmtD(x)); }
  } else if(r.mode==='month'){
    for(let i=0;i<3;i++){
      const y=base.getFullYear(), m=base.getMonth()+i;
      const last=new Date(y,m+1,0).getDate();
      const x=new Date(y,m,Math.min(r.md,last));
      if(x>=base) dates.push(fmtD(x));
    }
  } else {
    for(let i=1;i<=3;i++){ const x=new Date(base); x.setDate(x.getDate()+r.every*i); dates.push(fmtD(x)); }
  }
  dates.forEach(dt=>{
    todos.push(T({title:r.title.trim(),due:dt,time:r.time,imp:r.imp,urg:r.urg,
      cat:r.cat,domain:S.domain,remark:r.title.trim(),recur:true}));
  });
  document.querySelectorAll('.modal-mask').forEach(m=>m.remove());
  const name=r.title.trim(), n=dates.length, first=dates[0]||'';
  S._recur=null; S._recurFocused=false;   /* 下次再打开要重新把光标落进标题框 */
  toast(`已创建「${name}」· 先排了 ${n} 次，从 ${first.slice(5)} 开始`);
  render();
}

  const today = applyFilter(listTodos().filter(t=>t.due===TODAY || (t.done&&t.doneAt&&t.doneAt.startsWith(TODAY))));
  if(hasFilter() && !od.length && !today.length)
    return '<div class="emptybox">没有匹配的 · 点【清空】看看全部</div>';
  return `
    ${od.length?`<div style="display:flex;gap:6px;align-items:center;color:#DC2626;font-size:13px;font-weight:600;padding:6px 2px 0">
       <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
       逾期 ${od.length} 件</div>`:''}
    ${od.map(itemHTML).join('')}
    <div class="grouptitle" style="margin-top:6px">今天</div>
    ${today.length?today.map(itemHTML).join(''):'<div class="emptybox">今天没有安排</div>'}
    <div style="height:64px"></div>`;      /* 给悬浮按钮留位置，不再挂一句说明 */
}

function parseHTML(){
  /* 聚焦态下「归属」自动就是当前域（工作 / 生活），不用再选一次 */
  const p=S.parse||{domain:S.domain,imp:null,urg:null}, has=!!S.parse;
  /* 整行可点 → 弹选择/输入；手动改过的行标一个「手填」，表示再解析也不会被冲掉 */
  const f=(key,n,v)=>`<button class="field" data-act="field" data-v="${key}">
    <span class="fname">${n}</span>
    <span class="fval" style="${v?'':'color:var(--ink4)'}">${esc(v||'—')}${p.manual&&p.manual[key]?'<i class="mtag">手填</i>':''}</span>

  return `<div class="section ${S._panelIn?'panelin':''}" style="border-color:var(--brand)" data-act="noop">
    ${has?`<div class="hint" style="padding:0 0 2px">✦ 已按「${S.domain==='work'?'工作':'生活'}」填好 · 点任意一行都能改</div>`:''}

/* ============ ② 日历 B1 ============ */
function calendarHTML(){
  const y=S.calY, m=S.calM;                       /* M1：真实年月，可左右翻月 */
  const first=(new Date(y,m,1).getDay()||7)-1;    // 周一为一周起点
  const days=new Date(y,m+1,0).getDate();
  let html='', buf=[];
  const flush=()=>{ if(buf.length){ html+='<div class="calweek">'+buf.join('')+'</div>'; buf=[]; } };
  for(let i=0;i<first;i++) buf.push('<div class="cell empty"></div>');
  for(let d=1;d<=days;d++){
    const key=fmtD(new Date(y,m,d));
    const st=dayStat(key);
    const isToday=key===TODAY, hasOd=dayOverdue(key), hasRv=REV.has(key);   /* V0.2：只有真生成出来才给灰底 */
    buf.push(`<button class="cell ${hasRv?'hasreview':''} ${isToday?'today':''} ${S.day===key?'sel':''}" data-act="day" data-v="${key}">
        <span class="cellnum">${d}</span>
        ${st.total?`<span class="cellstat"><b>${st.done}</b><i>●</i><b>${st.undone}</b><i>○</i></span>`:'<span class="cellstat"></span>'}
        ${hasOd?'<span class="underline"></span>':''}
      </button>`);
    if(buf.length===7) flush();
  }
  /* 最后一行也要用空白格补满 7 位：.cell 是 flex:1，行内不足 7 格会被拉伸摊开，
     日期就压在错误的列上（不跟表头一~日对齐）。补满后每格待在各自的列里。 */
  while(buf.length && buf.length<7) buf.push('<div class="cell empty"></div>');
  flush();
  const grid=`<div class="calhead">${['一','二','三','四','五','六','日'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="calgrid">${html}</div>`;
  return `
  <div class="stack">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0">
      <span style="font-size:18px;font-weight:600">${y} 年 ${m+1} 月</span>
      <span style="display:flex;gap:8px">
        <button class="btn ghost" data-act="calm" data-v="-1" style="flex:none;padding:4px 14px">‹</button>
        <button class="btn ghost" data-act="calm" data-v="1" style="flex:none;padding:4px 14px">›</button>
      </span>
    </div>
    ${calFilterBtnHTML()}
    <button class="row" data-act="recur" style="padding:10px 12px">
      <span style="font-size:16px;flex:none">🔁</span>
      <span style="flex:1;font-size:14px;color:var(--ink)">循环安排 · 周会 / 每月缴费 / 每隔几天</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    ${grid}
    <div class="hint">● 已完成 · ○ 未完成 · 红线 = 有逾期 · 灰底 = 有总结</div>
  </div>`;
}

/* V0.2 · 复盘卡片（FR-016 / FR-017）
   归属「上一天」· 生成后锁定 · 中性灰框不随域变色（它是跨域的）
   失败不弹窗：只在这里留一句「下次打开自动重试」 */
function reviewBoxHTML(key){
  const r=reviews[key], f=REV.fact(key);
  const stat=r?`完成 ${r.done}/${r.total} · 逾期 ${r.overdue} 件`:`完成 ${f.done} 件`;
  const regen=(REV.worth(key)||key===TODAY)
    ? `<button class="regen" data-act="regen" data-v="${key}">重新生成</button>` : '';
  let body;
  if(r && r.text){
    body=`<div class="reviewtext">${esc(r.text)}</div>
      <div class="reviewmeta"><span>${stat}${r.manual?' · 手动重算':''}</span><span>生成于 ${esc(String(r.genAt||'').slice(5,16))}</span></div>
      <div style="margin-top:8px;display:flex;justify-content:flex-end">${regen}</div>`;
  }else if(r && r.pending){
    body=`<div class="reviewtext" style="color:var(--ink4)">还没生成出来 · 下次打开自动重试，不会弹窗打扰你</div>
      <div class="reviewmeta"><span>${stat}</span><span>${AI.ready()?'重试中 · '+regen:'待配置 AI'}</span></div>`;
  }else if(key>=TODAY){
    body=`<div class="reviewtext" style="color:var(--ink4)">${key>TODAY?'这天还没到':'今天的总结<b>明天打开时</b>才生成 —— 复盘是回头看昨天，不是实时播报'}</div>
      <div class="reviewmeta"><span>${stat}</span><span>${regen}</span></div>`;
  }else if(!REV.worth(key)){
    body=`<div class="reviewtext" style="color:var(--ink4)">这天没什么动静，没有留总结 —— 空白记录不占位</div>`;
  }else{
    body=`<div class="reviewtext" style="color:var(--ink4)">${AI.ready()?'正在生成…':'接上 AI 后，下次打开自动补上（没接 AI 也能用，只是没这句总结）'}</div>
      <div class="reviewmeta"><span>${stat}</span><span>${regen}</span></div>`;
  }
  return `<div class="reviewbox">
    <div style="font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:8px">当天复盘 · 工作 + 生活合并成一句话</div>
    ${body}</div>`;
}

/* ============ 自动备份存档（V0.2 · 只读 / 导出）============
   注意：这个页面**不会触发备份** —— 备份是每次打开 App 自动做的。
   这里只是把已经存在的快照摊开给你看、并且能导出成文件带走。 */
function bakHTML(){
  const ks=BAK.list().slice().reverse();          /* 新的在上 */
  let totalBytes=0;
  const rows=ks.map(k=>{
    const raw=localStorage.getItem(k)||'';
    totalBytes+=raw.length;
    let n=0, when='';
    try{ const o=JSON.parse(raw); n=(o.todos||[]).length; when=o.at||''; }catch(e){}
    const date=k.slice(BAK.PFX.length);
    return `<div class="field" style="cursor:default">
      <span class="fname">${esc(date)}</span>
      <span class="fval">${n} 条 · ${(raw.length/1024).toFixed(1)} KB</span>
      <span class="fact"><button class="btn ghost" style="padding:3px 10px;font-size:12px;border-radius:8px" data-act="bakone" data-v="${esc(date)}">导出</button></span>
    </div>`;
  }).join('');
  return `<div class="backrow"><button class="backbtn" data-act="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button></div>
    <div class="pagetitle">自动备份存档</div>
    <div class="stack">
      <div class="hint">这些快照在本地数据仓库里，<b>只有点「导出」才会变成文件</b> · 保留最近 30 天</div>
      ${ks.length?`
      <div class="btnrow"><button class="btn" data-act="bakall">全部导出成一个文件</button></div>
      <div class="grouptitle">共 ${ks.length} 份 · 合计 ${(totalBytes/1024).toFixed(0)} KB</div>
      ${rows}`
      :'<div class="emptybox">还没有备份 —— 关掉页面重新打开一次就有了</div>'}
    </div>`;
}

/* 拉取这个 Key 能用的模型列表（OpenAI 兼容协议的 /models 接口） */
async function fetchModels(){
  const c=AI.cfg;
  if(!c.base||!c.key) throw new Error('先填接口地址和 API Key');
  const url=c.base.replace(/\/+$/,'')+'/models';
  const inner=(async()=>{
    try{
      const r=await fetch(url,{headers:{'Authorization':'Bearer '+c.key}});
      if(!r.ok) throw new Error(aiErrText(r.status, await r.text().catch(()=>'')));
      const j=await r.json();
      const ids=(j&&Array.isArray(j.data)?j.data.map(m=>m&&m.id):[]).filter(Boolean);
      if(!ids.length) throw new Error('这个接口没返回模型列表（不支持 /models，请手填模型名）');
      return ids.sort();
    }catch(e){
      /* 和 llmChat 同样处理：连响应都没拿到，多半是被浏览器的跨域限制拦了 */
      if(e instanceof TypeError || /Failed to fetch|NetworkError|Network request failed|Load failed/i.test(String(e && e.message)))
        throw new Error('请求没发出去 —— 通常是浏览器跨域限制拦的：确认是双击 index.html 打开（file://）、或换 DeepSeek / 用手机 App');
      throw e;
    }
  })();
  return withTimeout(inner, 10000, '拉模型列表超时');
}

        ③ 静默失败 —— 失败也只是状态栏一行字，绝不弹框 */
function autoProbe(kind){
  if(kind==='cloud'){
    if(!SYNC.ready()) return;                       /* 没配过 → 不打扰 */
    if(SYNC.st.state==='ok') return;                /* 已经连着 → 不用再测 */
    SYNC.say('wait','正在自动连接…');
    SYNC.run().then(()=>{ if(S.sub==='cloud') render(); }).catch(()=>{});
    return;
  }
  if(kind==='ai'){
    if(!AI.ready() || AI.cfg.ok) return;            /* 没配过、或上次就是通的 → 不动 */
    AI.say('正在自动连接…', false);
    (async()=>{
      try{
        await withTimeout(llmChat('你只回复两个字：正常','ping',8000), 8000, '响应超时');
        AI.cfg.ok=true; AI.cfg.testedAt=nowStamp();

      }catch(err){ AI.say('连不上：'+((err&&err.message)||'未知原因'), false); }
      if(S.sub==='ai') render();
    })();
    return;
  }
}

/* 复制到剪贴板：优先用新 API，不行就用老办法（file:// 下两种都试过可用） */
function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy');
    ta.remove(); return !!ok;
  }catch(e){ return false; }
}
